<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yas Doce Essência — Sistema V16</title>
<style>
:root{
  --bg:#f7f4fb;--surface:#ffffff;--surface2:#f1e9f8;--text:#22172a;--muted:#735f7f;--border:#e7d9ef;
  --primary:#8c3cc2;--primary2:#c85be1;--primary3:#5c1b84;--success:#0fa66d;--warning:#e6a000;--danger:#d44562;
  --blue:#3e7cf4;--cyan:#14a7b7;--orange:#f28b3c;--pink:#e9549f;--shadow:0 14px 35px rgba(73,31,95,.12)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);transition:.25s background,.25s color}button,input,select{font:inherit}
body.dark{--bg:#0d0a12;--surface:#17121e;--surface2:#21172a;--text:#fff7ff;--muted:#cbb9d6;--border:#3b2a48;--primary:#c965ff;--primary2:#e090ff;--primary3:#8d39c0;--shadow:0 18px 44px rgba(0,0,0,.34)}
button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s,opacity .18s;color:inherit}button:hover{transform:translateY(-1px)}button:active{transform:translateY(0) scale(.98)}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(140,60,194,.22)}
.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);font-weight:700}.success{background:var(--success);color:white;font-weight:800}.danger{background:var(--danger);color:#fff;font-weight:800}.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
body.dark .secondary,body.dark .ghost{background:#271c31;color:#fff;border-color:#513b61}body.dark .secondary:hover,body.dark .ghost:hover{background:#342340}body.dark .primary{box-shadow:0 10px 26px rgba(201,101,255,.26)}
input,select{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px 12px;outline:none;transition:.2s}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(140,60,194,.13)}
label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin:10px 0 6px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#d491ef 0,transparent 28%),radial-gradient(circle at 88% 16%,#8647d6 0,transparent 30%),linear-gradient(135deg,#4f176f,#a23cc3 52%,#e588f4)}
.login-card{width:min(430px,100%);background:rgba(255,255,255,.96);padding:28px;border-radius:28px;box-shadow:0 28px 90px rgba(0,0,0,.28);animation:pop .45s ease}body.dark .login-card{background:#18111f;color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:11px}.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-size:23px;box-shadow:0 10px 24px rgba(140,60,194,.25)}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted);margin-top:2px}
.topbar{height:70px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:50}.top-actions{display:flex;gap:8px;align-items:center}.icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:18px}
.shell{display:flex;min-height:calc(100vh - 70px)}.sidebar{width:265px;background:var(--surface);border-right:1px solid var(--border);padding:12px;transition:.26s width,.26s transform;overflow:hidden}.sidebar.hidden{width:0;padding-left:0;padding-right:0;border-right:0}.side-title{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 10px 6px}.nav-main{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;color:var(--text);font-weight:850;padding:11px 10px}.nav-main:hover,.nav-main.active{background:var(--surface2)}.nav-main span:first-child{display:flex;align-items:center;gap:9px}.nav-sub{display:none;padding:2px 0 7px 12px;animation:slide .18s ease}.nav-sub.open{display:block}.nav-sub button{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);padding:9px 10px}.nav-sub button:hover,.nav-sub button.active{background:var(--surface2);color:var(--text);font-weight:800}.chev{transition:.2s}.open-parent .chev{transform:rotate(90deg)}
@keyframes slide{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.content{flex:1;min-width:0;padding:22px;max-width:1600px;margin:0 auto;width:100%}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}.page-head h1{margin:0;font-size:27px}.page-head p{margin:4px 0 0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:fadeUp .35s ease both}.kpi:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-28px;top:-30px;background:var(--accent,#8c3cc2);opacity:.12}.kpi .label{color:var(--muted);font-size:12px;font-weight:800}.kpi .value{font-size:26px;font-weight:950;margin:6px 0}.kpi .delta{font-size:12px;font-weight:800}.up{color:var(--success)}.down{color:var(--danger)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px;animation:fadeUp .35s ease both}.card h3{margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.muted{color:var(--muted);font-size:12px}.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900;background:var(--surface2)}.tag.ok{background:rgba(15,166,109,.13);color:var(--success)}.tag.warn{background:rgba(230,160,0,.14);color:#b57800}.tag.res{background:rgba(140,60,194,.13);color:var(--primary)}.tag.bad{background:rgba(212,69,98,.13);color:var(--danger)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--border);font-size:13px;text-align:left}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.clickable{cursor:pointer}.clickable:hover{background:var(--surface2)}
.filters{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.filters>div{min-width:150px;flex:1}.filters .small{flex:0 0 auto;min-width:auto}
.chart-box{min-height:250px;position:relative}.bar-chart{display:flex;align-items:flex-end;gap:10px;height:210px;padding:15px 5px 28px;border-bottom:1px solid var(--border)}.bar-col{flex:1;min-width:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}.bar{width:min(46px,82%);border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--accent,var(--primary2)),var(--primary));min-height:4px;transform-origin:bottom;animation:grow .65s cubic-bezier(.2,.8,.2,1)}.bar-col small{color:var(--muted);font-size:10px;white-space:nowrap}.bar-col b{font-size:10px}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.line-svg{width:100%;height:220px}.line-grid{stroke:var(--border);stroke-width:1}.line-path{fill:none;stroke:var(--primary2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1s forwards}.line-dot{fill:var(--surface);stroke:var(--primary);stroke-width:3}@keyframes draw{to{stroke-dashoffset:0}}
.donut-wrap{display:grid;place-items:center;min-height:220px}.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--success) 0 var(--paid),var(--warning) var(--paid) 100%);position:relative;display:grid;place-items:center}.donut:after{content:"";position:absolute;width:105px;height:105px;border-radius:50%;background:var(--surface)}.donut-label{position:relative;z-index:1;text-align:center}.donut-label b{font-size:24px;display:block}
.modal-layer{position:fixed;inset:0;z-index:1000;pointer-events:none}.modal-bg{position:absolute;inset:0;background:rgba(9,5,12,.55);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;pointer-events:auto;animation:fade .2s}.modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 30px 100px rgba(0,0,0,.35);animation:pop .2s}.modal.wide{width:min(980px,100%)}@keyframes fade{from{opacity:0}to{opacity:1}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.divider{height:1px;background:var(--border);margin:15px 0}.empty{text-align:center;padding:40px 16px;color:var(--muted)}
/* customer */
.customer-shell{min-height:100vh;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 10%,var(--bg)),var(--bg) 320px)}.customer-top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;max-width:1100px;margin:auto}.customer-main{max-width:1100px;margin:auto;padding:10px 18px 110px}.hero{padding:26px 0 18px}.hero h1{font-size:34px;margin:12px 0 6px}.hero p{color:var(--muted);max-width:650px}.customer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.product-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px;animation:fadeUp .35s ease both}.product-icon{width:58px;height:58px;border-radius:18px;background:var(--surface2);display:grid;place-items:center;font-size:28px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:38px;height:38px;padding:0;border-radius:50%;background:var(--surface2);border:1px solid var(--border);font-size:20px}.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 18px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--border)}.cartbar-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.code{font-size:34px;letter-spacing:.12em;font-weight:950;color:var(--primary);background:var(--surface2);padding:15px 18px;border-radius:18px;display:inline-block}.notice{padding:12px;border-radius:14px;background:rgba(62,124,244,.11);border:1px solid rgba(62,124,244,.25)}
.toast{position:fixed;right:18px;bottom:18px;z-index:2000;background:#22172a;color:#fff;padding:12px 15px;border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.25);animation:toast .25s ease}.toast.hide{opacity:0;transform:translateY(8px)}@keyframes toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.sidebar{position:fixed;top:70px;bottom:0;left:0;z-index:60;box-shadow:20px 0 50px rgba(0,0,0,.16)}.sidebar.hidden{transform:translateX(-100%);width:265px}.content{padding:16px}.customer-grid{grid-template-columns:1fr}}
@media(max-width:620px){.topbar{padding:0 10px}.brand small{display:none}.content{padding:12px}.cards{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:13px}.kpi .value{font-size:20px}.page-head{align-items:flex-start;flex-direction:column}.two,.three{grid-template-columns:1fr}.customer-top{padding:0 12px}.customer-main{padding-left:12px;padding-right:12px}.hero h1{font-size:28px}.product-card{padding:14px}.code{font-size:25px}.filters>div{min-width:120px}}
</style>
</head>
<body>
<div id="app"></div><div id="modalLayer" class="modal-layer"></div><div id="toastRoot"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m])),uid=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),isoToday=()=>new Date().toISOString().slice(0,10),nowTime=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const defaults={adminUser:'admin',adminPass:'1234',storeName:'Yas Doce Essência',customerMessage:'Reserve seus produtos favoritos e retire no local.',minOrder:0,allowPix:true,allowCash:true,allowLater:true,storeOpen:true,orderPrefix:'YD'};
let D={products:[],orders:[],expenses:[],customerAccounts:[],dailyStock:[],config:{...defaults},dark:false,imports:[]};
try{let x=JSON.parse(localStorage.getItem('yas_doce_data')||'null');if(x)D={...D,...x,config:{...defaults,...(x.config||{})}}}catch(e){}
function save(){localStorage.setItem('yas_doce_data',JSON.stringify(D))}
function toast(t){let el=document.createElement('div');el.className='toast';el.textContent=t;$('#toastRoot').appendChild(el);setTimeout(()=>el.classList.add('hide'),2200);setTimeout(()=>el.remove(),2600)}
function brand(){return `<div class="brand"><div class="mark">🧁</div><div><strong>${esc(D.config.storeName)}</strong><small>Gestão e reservas</small></div></div>`}
function loginView(){document.body.classList.toggle('dark',!!D.dark);app.innerHTML=`<div class="login"><div class="login-card"><div style="display:flex;justify-content:center;margin-bottom:18px">${brand()}</div><h1 style="margin:0 0 6px">Acesso administrativo</h1><p class="muted">Entre para gerenciar pedidos, estoque, clientes e financeiro.</p><label>Usuário</label><input id="loginUser" autocomplete="username"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password"><button class="primary" style="width:100%;margin-top:14px" onclick="ADM.login()">Entrar</button><button class="ghost" style="width:100%;margin-top:10px" onclick="Customer.open(false)">🛍️ Abrir cardápio do cliente</button></div></div>`}
function login(){if(loginUser.value===D.config.adminUser&&loginPass.value===D.config.adminPass){sessionStorage.setItem('yas_admin','1');adminView()}else toast('Usuário ou senha inválidos')}
function logout(){sessionStorage.removeItem('yas_admin');loginView()}
function toggleSide(){document.body.classList.toggle('side-off') ;let s=$('.sidebar');if(s)s.classList.toggle('hidden')}
function toggleGroup(id){let el=$('#'+id);if(el)el.classList.toggle('open');el?.parentElement.classList.toggle('open-parent')}
let page='dashboard',sideHidden=false;
function nav(){return `<aside class="sidebar ${sideHidden?'hidden':''}"><div class="side-title">Principal</div><button class="nav-main ${page==='dashboard'?'active':''}" onclick="ADM.go('dashboard')"><span>📊 Dashboard</span></button><div class="side-title">Operação</div><button class="nav-main" onclick="ADM.toggleGroup('op-sub')"><span>🧾 Operação</span><span class="chev">›</span></button><div id="op-sub" class="nav-sub ${['orders','validate','customers'].includes(page)?'open':''}"><button class="${page==='orders'?'active':''}" onclick="ADM.go('orders')">Pedidos</button><button class="${page==='validate'?'active':''}" onclick="ADM.go('validate')">Validar / Liberar</button><button class="${page==='customers'?'active':''}" onclick="ADM.go('customers')">Clientes</button></div><div class="side-title">Catálogo</div><button class="nav-main" onclick="ADM.toggleGroup('cat-sub')"><span>🍰 Catálogo</span><span class="chev">›</span></button><div id="cat-sub" class="nav-sub ${['stock','menu'].includes(page)?'open':''}"><button class="${page==='stock'?'active':''}" onclick="ADM.go('stock')">Estoque do dia</button><button class="${page==='menu'?'active':''}" onclick="ADM.go('menu')">Cardápio</button></div><div class="side-title">Financeiro</div><button class="nav-main" onclick="ADM.toggleGroup('fin-sub')"><span>💰 Financeiro</span><span class="chev">›</span></button><div id="fin-sub" class="nav-sub ${['cash','expenses','reports'].includes(page)?'open':''}"><button class="${page==='cash'?'active':''}" onclick="ADM.go('cash')">Caixa</button><button class="${page==='expenses'?'active':''}" onclick="ADM.go('expenses')">Despesas</button><button class="${page==='reports'?'active':''}" onclick="ADM.go('reports')">Relatórios</button></div><div class="side-title">Sistema</div><button class="nav-main" onclick="ADM.go('settings')"><span>⚙️ Configurações</span></button><button class="nav-main" onclick="ADM.go('import')"><span>📥 Importar planilha</span></button></aside>`}
function top(){return `<header class="topbar"><button class="icon-btn" onclick="ADM.toggleSide()">☰</button><div class="top-actions"><button class="icon-btn" onclick="ADM.theme()">${D.dark?'☀️':'🌙'}</button><button class="secondary" onclick="Customer.open(true)">🛍️ Simular cliente</button><button class="danger" onclick="ADM.logout()">Sair</button></div></header>`}
function adminView(){document.body.classList.toggle('dark',!!D.dark);renderPage()}
function renderPage(){app.innerHTML=top()+`<div class="shell">${nav()}<main class="content">${pageHtml()}</main></div>`}
function go(p){page=p;renderPage()}
function theme(){D.dark=!D.dark;save();renderPage()}
function monthStart(){let d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10)}
function thisMonth(){return D.orders.filter(o=>o.iso>=monthStart())}
function calc(){let revenue=D.orders.reduce((s,o)=>s+(Number(o.total)||0),0),received=D.orders.filter(o=>o.paid).reduce((s,o)=>s+(Number(o.total)||0),0),pending=revenue-received,expenses=D.expenses.reduce((s,e)=>s+(Number(e.value)||0),0);return {revenue,received,pending,expenses,balance:received-expenses}}
function dashboard(){let c=calc(),orders=D.orders.slice().sort((a,b)=>(b.iso+b.time).localeCompare(a.iso+a.time));return `<div class="page-head"><div><h1>Dashboard</h1><p>Visão geral das vendas, caixa e pedidos.</p></div><button class="primary" onclick="ADM.go('orders')">Ver pedidos →</button></div><div class="cards"><div class="kpi" style="--accent:var(--primary)"><div class="label">Faturamento</div><div class="value">${money(c.revenue)}</div><div class="delta">Todas as vendas</div></div><div class="kpi" style="--accent:var(--success)"><div class="label">Recebido</div><div class="value">${money(c.received)}</div><div class="delta up">Pagamentos confirmados</div></div><div class="kpi" style="--accent:var(--warning)"><div class="label">A receber</div><div class="value">${money(c.pending)}</div><div class="delta">Pendentes</div></div><div class="kpi" style="--accent:var(--blue)"><div class="label">Saldo em caixa</div><div class="value">${money(c.balance)}</div><div class="delta">Recebido − despesas</div></div></div><div class="grid2"><div class="card"><h3>Vendas recentes</h3>${orders.slice(0,7).map(o=>`<div class="row clickable" onclick="ADM.orderDetail('${o.id}')"><div><b>${esc(o.clientName)}</b><div class="muted">${o.iso} · ${o.time||'—'} · ${esc(o.items.map(i=>i.qty+'× '+i.name).join(', '))}</div></div><div style="text-align:right"><b>${money(o.total)}</b><div><span class="tag ${o.paid?'ok':'warn'}">${o.paid?'Pago':'Pendente'}</span> <span class="tag res">${esc(o.status)}</span></div></div></div>`).join('')||'<div class="empty">Nenhum pedido.</div>'}</div><div class="card"><h3>Resumo financeiro</h3><div class="row"><span>Recebido</span><b class="up">${money(c.received)}</b></div><div class="row"><span>Despesas</span><b>${money(c.expenses)}</b></div><div class="row"><span>A receber</span><b>${money(c.pending)}</b></div><div class="row"><span>Pedidos</span><b>${D.orders.length}</b></div><div class="row"><span>Clientes cadastrados</span><b>${D.customerAccounts.length}</b></div></div></div>`}
function ordersPage(){let arr=D.orders.slice().sort((a,b)=>(b.iso+b.time).localeCompare(a.iso+a.time));return `<div class="page-head"><div><h1>Pedidos</h1><p>Reservas feitas pelo cliente ou pelo ADM.</p></div><button class="primary" onclick="Customer.open(true)">+ Novo pedido</button></div><div class="card"><div class="filters"><div><label>Data</label><input id="ofDate" type="date" onchange="ADM.refresh()"></div><div><label>Pagamento</label><select id="ofPay" onchange="ADM.refresh()"><option value="">Todos</option><option value="paid">Pagos</option><option value="pending">Pendentes</option></select></div><div><label>Status do pedido</label><select id="ofStatus" onchange="ADM.refresh()"><option value="">Todos</option><option>Reservado</option><option>Entregue</option></select></div></div></div><div id="ordersTable"></div>`}
function refresh(){let date=$('#ofDate')?.value||'',pay=$('#ofPay')?.value||'',st=$('#ofStatus')?.value||'';let arr=D.orders.filter(o=>(!date||o.iso===date)&&(!pay||(pay==='paid'?o.paid:!o.paid))&&(!st||o.status===st)).sort((a,b)=>(b.iso+b.time).localeCompare(a.iso+a.time));let box=$('#ordersTable');if(!box)return;box.innerHTML=`<div class="card table-wrap"><table class="table"><thead><tr><th>Data</th><th>Cliente</th><th>Produtos</th><th>Total</th><th>Pagamento</th><th>Pedido</th><th>Ações</th></tr></thead><tbody>${arr.map(o=>`<tr><td>${o.iso}<br><span class="muted">${o.time||''}</span></td><td><b>${esc(o.clientName)}</b></td><td>${esc(o.items.map(i=>i.qty+'× '+i.name).join(', '))}</td><td><b>${money(o.total)}</b></td><td><span class="tag ${o.paid?'ok':'warn'}">${o.paid?'Pago':'Pendente'}</span><br><span class="muted">${esc(o.method)}</span></td><td><span class="tag res">${esc(o.status)}</span></td><td><button class="secondary" onclick="ADM.orderDetail('${o.id}')">Abrir</button> <button class="danger" onclick="ADM.deleteOrder('${o.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhum pedido encontrado.</td></tr>'}</tbody></table></div>`}
function orderDetail(id){let o=D.orders.find(x=>x.id===id);if(!o)return;let same=D.orders.filter(x=>x.clientName.toLowerCase()===o.clientName.toLowerCase()&&x.iso===o.iso),daily=same.reduce((s,x)=>s+x.total,0);modal(`<h2>Pedido de ${esc(o.clientName)}</h2><p class="muted">${o.iso} · ${o.time||'—'} · código reservado: não exibido nesta tela</p><div class="row"><span>Status do pedido</span><span class="tag res">${esc(o.status)}</span></div><div class="row"><span>Pagamento</span><span class="tag ${o.paid?'ok':'warn'}">${o.paid?'Pago':'Pendente'}</span></div>${o.items.map(i=>`<div class="row"><span>${i.qty}× ${esc(i.name)}</span><b>${money(i.qty*i.price)}</b></div>`).join('')}<div class="row"><b>Total do pedido</b><b>${money(o.total)}</b></div><div class="notice">Total gasto por ${esc(o.clientName)} em ${o.iso}: <b>${money(daily)}</b> (${same.length} pedido(s)).</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="${o.paid?'secondary':'success'}" onclick="ADM.togglePaid('${o.id}')">${o.paid?'Marcar como pendente':'Marcar como pago'}</button>${o.status!=='Entregue'?`<button class="success" onclick="ADM.deliver('${o.id}')">Marcar entregue</button>`:''}<button class="danger" onclick="ADM.deleteOrder('${o.id}')">Excluir pedido</button><button class="ghost" onclick="ADM.closeModal()">Fechar</button></div>`,false)}
function deleteOrder(id){let o=D.orders.find(x=>x.id===id);if(!o)return;if(!confirm('Excluir este pedido? O histórico financeiro será removido.'))return;D.orders=D.orders.filter(x=>x.id!==id);save();closeModal();renderPage();if(page==='orders')refresh();toast('Pedido excluído')}
function togglePaid(id){let o=D.orders.find(x=>x.id===id);if(!o)return;o.paid=!o.paid;save();closeModal();renderPage();if(page==='orders')refresh();toast(o.paid?'Pagamento confirmado':'Pagamento marcado como pendente')}
function validatePage(){return `<div class="page-head"><div><h1>Validar / Liberar pedido</h1><p>Digite o código informado pelo cliente para liberar o pedido.</p></div></div><div class="card"><label>Código do pedido</label><input id="codeInput" placeholder="Ex.: YD-AB12C"><button class="primary" style="margin-top:12px" onclick="ADM.checkCode()">Validar código</button></div><div class="card"><h3>Como funciona</h3><p class="muted">O código é mostrado somente ao cliente após a reserva. Ele não aparece na lista comum de pedidos nem no histórico.</p></div>`}
function checkCode(){let code=codeInput.value.trim().toUpperCase(),o=D.orders.find(x=>String(x.code).toUpperCase()===code);if(!o)return toast('Código não encontrado');modal(`<h2>Pedido localizado</h2><p><b>${esc(o.clientName)}</b> · ${o.iso} · ${o.time||'—'}</p>${o.items.map(i=>`<div class="row"><span>${i.qty}× ${esc(i.name)}</span><b>${money(i.qty*i.price)}</b></div>`).join('')}<div class="row"><b>Total</b><b>${money(o.total)}</b></div><p><span class="tag ${o.paid?'ok':'warn'}">${o.paid?'Pago':'Pendente'}</span> <span class="tag res">${esc(o.status)}</span></p><button class="success" style="width:100%" onclick="ADM.deliver('${o.id}')">Liberar / marcar como entregue</button>`,false)}
function deliver(id){let o=D.orders.find(x=>x.id===id);if(!o)return;o.status='Entregue';save();closeModal();renderPage();toast('Pedido liberado e marcado como entregue')}
function customersPage(){return `<div class="page-head"><div><h1>Clientes</h1><p>Pesquise clientes, veja histórico por data e filtre pagamentos.</p></div></div><div class="card"><div class="filters"><div><label>Buscar cliente</label><input id="cfSearch" placeholder="Nome..." oninput="ADM.filterCustomers()"></div><div><label>Status de pagamento</label><select id="cfPay" onchange="ADM.filterCustomers()"><option value="all">Todos</option><option value="paid">Concluídos / Pagos</option><option value="pending">Pendentes</option></select></div></div></div><div id="customersList"></div>`}
function filterCustomers(){let q=($('#cfSearch')?.value||'').toLowerCase(),f=$('#cfPay')?.value||'all';let names=[...new Set(D.orders.map(o=>o.clientName))].filter(n=>n.toLowerCase().includes(q));let box=$('#customersList');if(!box)return;box.innerHTML=`<div class="card">${names.map(name=>{let arr=D.orders.filter(o=>o.clientName===name),ok=arr.filter(o=>o.paid).length,pen=arr.filter(o=>!o.paid).length;let show=f==='all'||(f==='paid'&&ok)||(f==='pending'&&pen);if(!show)return '';let total=arr.reduce((s,o)=>s+o.total,0);return `<div class="row"><div><b>${esc(name)}</b><div class="muted">${arr.length} pedido(s) · ${ok} pago(s) · ${pen} pendente(s)</div></div><div style="display:flex;align-items:center;gap:8px"><b>${money(total)}</b><button class="secondary" onclick="ADM.customerDetail('${esc(name).replace(/'/g,"\\'")}')">Histórico</button><button class="danger" onclick="ADM.deleteCustomerAccount('${esc(name).replace(/'/g,"\\'")}')">Excluir conta</button></div></div>`}).join('')||'<div class="empty">Nenhum cliente encontrado.</div>'}</div>`}
function customerDetail(name){let arr=D.orders.filter(o=>o.clientName===name).sort((a,b)=>(b.iso+b.time).localeCompare(a.iso+a.time));let by={};arr.forEach(o=>(by[o.iso]??=[]).push(o));modal(`<h2>Histórico — ${esc(name)}</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="secondary" onclick="ADM.exportCustomerHistory('${esc(name).replace(/'/g,"\\'")}','all')">Exportar tudo</button><button class="secondary" onclick="ADM.exportCustomerHistory('${esc(name).replace(/'/g,"\\'")}','paid')">Exportar pagos</button><button class="secondary" onclick="ADM.exportCustomerHistory('${esc(name).replace(/'/g,"\\'")}','pending')">Exportar pendentes</button></div>${Object.entries(by).map(([date,items])=>`<div class="card"><h3>${date} · total do dia ${money(items.reduce((s,o)=>s+o.total,0))}</h3>${items.map(o=>`<div class="row"><div><b>${o.time||'—'} · ${esc(o.items.map(i=>i.qty+'× '+i.name).join(', '))}</b><div class="muted">${esc(o.method)} · pedido ${esc(o.status)}</div></div><div><b>${money(o.total)}</b><br><span class="tag ${o.paid?'ok':'warn'}">${o.paid?'Pago':'Pendente'}</span></div></div>`).join('')}</div>`).join('')}`,true)}
function exportCustomerHistory(name,status='all'){let arr=D.orders.filter(o=>o.clientName===name&& (status==='all'||(status==='paid'?o.paid:!o.paid)));let lines=[['Data','Hora','Cliente','Produtos','Quantidade','Total','Pagamento','Status do pagamento','Status do pedido','Vencimento']];arr.forEach(o=>lines.push([o.iso,o.time||'',o.clientName,o.items.map(i=>i.name).join(' | '),o.items.reduce((s,i)=>s+i.qty,0),o.total,o.method,o.paid?'Pago':'Pendente',o.status,o.due||'']));downloadCSV(lines,'historico_'+name.replace(/[^a-z0-9]+/gi,'_')+'_'+status+'.csv')}
function deleteCustomerAccount(name){let a=D.customerAccounts.filter(x=>x.name===name);if(!confirm('Excluir a conta de acesso deste cliente? Os pedidos e o histórico serão preservados.'))return;D.customerAccounts=D.customerAccounts.filter(x=>x.name!==name);save();renderPage();if(page==='customers')filterCustomers();toast(a.length?'Conta excluída; histórico preservado':'Nenhuma conta cadastrada para este nome')}
function stockPage(){let dates=[...new Set(D.dailyStock.map(x=>x.date))].sort().reverse();return `<div class="page-head"><div><h1>Estoque do dia</h1><p>Controle de produção e saldo por data.</p></div><button class="primary" onclick="ADM.stockStep()">+ Abrir estoque de hoje</button></div><div class="card">${dates.map(d=>`<div class="row"><div><b>${d}</b><div class="muted">${D.dailyStock.filter(x=>x.date===d).length} registro(s)</div></div><div><button class="secondary" onclick="ADM.stockDayDetail('${d}')">Abrir</button><button class="danger" onclick="ADM.deleteStockDay('${d}')">Excluir dia</button></div></div>`).join('')||'<div class="empty">Nenhum dia de estoque registrado.</div>'}</div>`}
function stockStep(){let date=prompt('Data do estoque (AAAA-MM-DD):',isoToday());if(!date)return;let rows=D.products.map(p=>`<label>${esc(p.name)} — produzido</label><input id="prod_${p.id}" type="number" min="0" value="${D.dailyStock.find(x=>x.date===date&&x.productId===p.id)?.produced||0}">`).join('');modal(`<h2>Estoque — ${date}</h2>${rows}<button class="primary" style="margin-top:12px" onclick="ADM.saveDailyStock('${date}')">Salvar estoque</button>`,false)}
function saveDailyStock(date){D.products.forEach(p=>{let el=$('#prod_'+CSS.escape(p.id)),produced=Number(el?.value||0),r=D.dailyStock.find(x=>x.date===date&&x.productId===p.id);if(r){r.produced=produced;if(r.remaining>produced)r.remaining=produced}else if(produced>0)D.dailyStock.push({id:uid('DS'),date,productId:p.id,productName:p.name,produced,remaining:produced})});save();closeModal();renderPage();toast('Estoque salvo')}
function deleteDailyStockRecord(id){if(!confirm('Excluir este registro?'))return;D.dailyStock=D.dailyStock.filter(x=>x.id!==id);save();closeModal();renderPage()}
function deleteStockDay(date){if(!confirm('Excluir todo o estoque de '+date+'?'))return;D.dailyStock=D.dailyStock.filter(x=>x.date!==date);save();renderPage();toast('Dia excluído')}
function closeStockDay(date){toast('Dia fechado: o histórico permanece salvo')}
function confirmCloseStockDay(date){closeStockDay(date)}function reopenStockDay(date){toast('Dia reaberto')}
function stockDayDetail(date){let rows=D.dailyStock.filter(x=>x.date===date);modal(`<h2>Estoque — ${date}</h2>${rows.map(r=>`<div class="row"><div><b>${esc(r.productName)}</b><div class="muted">Produzido: ${r.produced}</div></div><div><b>${r.remaining}</b> restantes<br><button class="danger" onclick="ADM.deleteDailyStockRecord('${r.id}')">Excluir</button></div></div>`).join('')||'<div class="empty">Sem registros.</div>'}`,false)}
function menuPage(){return `<div class="page-head"><div><h1>Cardápio</h1><p>Produtos, preços e disponibilidade.</p></div><button class="primary" onclick="ADM.newProduct?.()">+ Produto</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Preço</th><th>Ativo</th><th>Estoque atual</th><th>Ações</th></tr></thead><tbody>${D.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${money(p.price)}</td><td><span class="tag ${p.active?'ok':'bad'}">${p.active?'Ativo':'Inativo'}</span></td><td>${p.stock??0}</td><td><button class="secondary" onclick="ADM.editProduct('${p.id}')">Editar</button><button class="danger" onclick="ADM.deleteProduct('${p.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum produto.</td></tr>'}</tbody></table></div>`}
function editProduct(id){let p=D.products.find(x=>x.id===id);if(!p)return;modal(`<h2>Editar produto</h2><label>Nome</label><input id="pName" value="${esc(p.name)}"><label>Preço</label><input id="pPrice" type="number" step="0.01" value="${p.price}"><label>Estoque disponível hoje</label><input id="pStock" type="number" min="0" value="${p.stock||0}"><label><input id="pActive" type="checkbox" ${p.active?'checked':''} style="width:auto"> Produto ativo</label><button class="primary" style="margin-top:12px" onclick="ADM.saveProduct('${p.id}')">Salvar</button>`,false)}
function saveProduct(id){let p=D.products.find(x=>x.id===id);if(!p)return;p.name=pName.value.trim();p.price=Number(pPrice.value);p.stock=Number(pStock.value);p.active=pActive.checked;save();closeModal();renderPage();toast('Produto salvo')}
function newProduct(){let id=uid('P');modal(`<h2>Novo produto</h2><label>Nome</label><input id="pName"><label>Preço</label><input id="pPrice" type="number" step="0.01"><label>Estoque disponível hoje</label><input id="pStock" type="number" min="0" value="0"><label><input id="pActive" type="checkbox" checked style="width:auto"> Produto ativo</label><button class="primary" style="margin-top:12px" onclick="ADM.saveNewProduct('${id}')">Criar</button>`,false)}
function saveNewProduct(id){let name=pName.value.trim();if(!name)return toast('Informe o nome');D.products.push({id,name,price:Number(pPrice.value||0),stock:Number(pStock.value||0),active:pActive.checked});save();closeModal();renderPage();toast('Produto criado')}
function deleteProduct(id){let p=D.products.find(x=>x.id===id);if(!p)return;if(!confirm('Excluir o produto do cardápio? O histórico de vendas será preservado.'))return;p.active=false;save();renderPage();toast('Produto desativado; histórico preservado')}
function cashPage(){let c=calc();return `<div class="page-head"><div><h1>Caixa</h1><p>Somente pagamentos confirmados entram no caixa disponível.</p></div></div><div class="cards"><div class="kpi"><div class="label">Recebido</div><div class="value">${money(c.received)}</div></div><div class="kpi"><div class="label">Despesas</div><div class="value">${money(c.expenses)}</div></div><div class="kpi"><div class="label">Saldo atual</div><div class="value">${money(c.balance)}</div></div><div class="kpi"><div class="label">A receber</div><div class="value">${money(c.pending)}</div></div></div><div class="card"><h3>Movimentações</h3>${D.orders.filter(o=>o.paid).map(o=>`<div class="row"><span>${o.iso} · ${esc(o.clientName)}</span><b class="up">+ ${money(o.total)}</b></div>`).join('')}${D.expenses.map(e=>`<div class="row"><span>${e.date} · ${esc(e.description)}</span><b>− ${money(e.value)}</b></div>`).join('')||'<div class="empty">Nenhuma movimentação.</div>'}</div>`}
function expensesPage(){return `<div class="page-head"><div><h1>Despesas</h1><p>Custos e saídas do negócio.</p></div><button class="primary" onclick="ADM.newExpense()">+ Despesa</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th></th></tr></thead><tbody>${D.expenses.map(e=>`<tr><td>${e.date}</td><td>${esc(e.description)}</td><td>${esc(e.category||'')}</td><td>${money(e.value)}</td><td><button class="danger" onclick="ADM.deleteExpense('${e.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhuma despesa.</td></tr>'}</tbody></table></div>`}
function newExpense(){modal(`<h2>Nova despesa</h2><label>Data</label><input id="eDate" type="date" value="${isoToday()}"><label>Descrição</label><input id="eDesc"><label>Categoria</label><input id="eCat" placeholder="Ingredientes, embalagem..."><label>Valor</label><input id="eVal" type="number" step="0.01"><button class="primary" style="margin-top:12px" onclick="ADM.saveExpense()">Salvar</button>`,false)}
function saveExpense(){if(!eDesc.value.trim())return toast('Informe a descrição');D.expenses.push({id:uid('E'),date:eDate.value,description:eDesc.value.trim(),category:eCat.value.trim(),value:Number(eVal.value||0),source:'site'});save();closeModal();renderPage();toast('Despesa registrada')}
function deleteExpense(id){if(!confirm('Excluir esta despesa?'))return;D.expenses=D.expenses.filter(x=>x.id!==id);save();renderPage();toast('Despesa excluída')}
function reportsPage(){let c=calc();return `<div class="page-head"><div><h1>Relatórios</h1><p>Filtre por período e exporte os dados.</p></div><button class="primary" onclick="ADM.exportReportCSV()">Exportar CSV</button></div><div class="card"><div class="filters"><div><label>Data inicial</label><input id="rfStart" type="date"></div><div><label>Data final</label><input id="rfEnd" type="date"></div><div class="small"><button class="secondary" onclick="ADM.applyReportFilter()">Aplicar filtro</button></div></div></div><div id="reportResult"><div class="cards"><div class="kpi"><div class="label">Faturamento</div><div class="value">${money(c.revenue)}</div></div><div class="kpi"><div class="label">Recebido</div><div class="value">${money(c.received)}</div></div><div class="kpi"><div class="label">A receber</div><div class="value">${money(c.pending)}</div></div><div class="kpi"><div class="label">Despesas</div><div class="value">${money(c.expenses)}</div></div></div></div>`}
function applyReportFilter(){let s=$('#rfStart')?.value||'',e=$('#rfEnd')?.value||'9999-12-31',arr=D.orders.filter(o=>o.iso>=s&&o.iso<=e),ex=D.expenses.filter(x=>x.date>=s&&x.date<=e),revenue=arr.reduce((a,o)=>a+o.total,0),received=arr.filter(o=>o.paid).reduce((a,o)=>a+o.total,0),pending=revenue-received,expenses=ex.reduce((a,x)=>a+x.value,0);$('#reportResult').innerHTML=`<div class="cards"><div class="kpi"><div class="label">Faturamento</div><div class="value">${money(revenue)}</div></div><div class="kpi"><div class="label">Recebido</div><div class="value">${money(received)}</div></div><div class="kpi"><div class="label">A receber</div><div class="value">${money(pending)}</div></div><div class="kpi"><div class="label">Despesas</div><div class="value">${money(expenses)}</div></div></div><div class="card"><h3>Vendas no período</h3>${arr.map(o=>`<div class="row"><span>${o.iso} · ${esc(o.clientName)}</span><b>${money(o.total)}</b></div>`).join('')||'<div class="empty">Sem vendas no período.</div>'}</div>`}
function exportReportCSV(){let lines=[['Data','Hora','Cliente','Produtos','Quantidade','Total','Pagamento','Status','Pedido','Vencimento']];D.orders.forEach(o=>lines.push([o.iso,o.time||'',o.clientName,o.items.map(i=>i.name).join(' | '),o.items.reduce((s,i)=>s+i.qty,0),o.total,o.method,o.paid?'Pago':'Pendente',o.status,o.due||'']));downloadCSV(lines,'relatorio_vendas.csv')}
function downloadCSV(rows,name){let csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function settingsPage(){return `<div class="page-head"><div><h1>Configurações</h1><p>Dados básicos do sistema e acesso administrativo.</p></div></div><div class="card"><div class="two"><div><label>Nome da loja</label><input id="cfgName" value="${esc(D.config.storeName)}"></div><div><label>Prefixo dos pedidos</label><input id="cfgPrefix" value="${esc(D.config.orderPrefix)}"></div></div><label>Mensagem do cliente</label><input id="cfgMsg" value="${esc(D.config.customerMessage)}"><div class="two"><div><label>Pedido mínimo</label><input id="cfgMin" type="number" step="0.01" value="${D.config.minOrder}"></div><div><label><input id="cfgOpen" type="checkbox" ${D.config.storeOpen?'checked':''} style="width:auto"> Reservas abertas</label></div></div><label>Formas de pagamento</label><div style="display:flex;gap:15px;flex-wrap:wrap"><label><input id="cfgPix" type="checkbox" ${D.config.allowPix?'checked':''} style="width:auto"> PIX</label><label><input id="cfgCash" type="checkbox" ${D.config.allowCash?'checked':''} style="width:auto"> Dinheiro</label><label><input id="cfgLater" type="checkbox" ${D.config.allowLater?'checked':''} style="width:auto"> A pagar depois</label></div><button class="primary" onclick="ADM.saveConfig()">Salvar configurações</button></div><div class="card"><h3>Administrador</h3><div class="two"><div><label>Usuário</label><input id="admUser" value="${esc(D.config.adminUser)}"></div><div><label>Nova senha</label><input id="admPass" type="password" placeholder="Deixe em branco para manter"></div></div><button class="secondary" onclick="ADM.saveAdmin()">Atualizar acesso</button></div>`}
function saveConfig(){D.config.storeName=cfgName.value.trim()||defaults.storeName;D.config.orderPrefix=cfgPrefix.value.trim()||'YD';D.config.customerMessage=cfgMsg.value;D.config.minOrder=Number(cfgMin.value||0);D.config.storeOpen=cfgOpen.checked;D.config.allowPix=cfgPix.checked;D.config.allowCash=cfgCash.checked;D.config.allowLater=cfgLater.checked;save();renderPage();toast('Configurações salvas')}
function saveAdmin(){D.config.adminUser=admUser.value.trim()||D.config.adminUser;if(admPass.value)D.config.adminPass=admPass.value;save();toast('Acesso administrativo atualizado')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='yas-doce-backup.json';a.click()}
function clearOperational(){if(!confirm('Limpar pedidos, despesas e estoque locais?'))return;D.orders=[];D.expenses=[];D.dailyStock=[];save();renderPage();toast('Dados operacionais locais limpos')}
function importPage(){return `<div class="page-head"><div><h1>Importar planilha</h1><p>Importe o arquivo Excel. Os dados importados substituem somente a camada anterior de importação; pedidos/despesas criados no site são preservados.</p></div></div><div class="card"><label>Arquivo .xlsx</label><input id="fileImport" type="file" accept=".xlsx,.xls,.csv"><button class="primary" style="margin-top:12px" onclick="ADM.handleImport()">Importar</button><div id="importStatus" class="muted" style="margin-top:12px"></div></div><div class="card"><h3>Sincronização planejada</h3><p class="muted">Fluxo online: Google Sheets ↔ banco online ↔ site. Nesta versão, a importação manual é o mecanismo seguro disponível no navegador; a sincronização bidirecional automática exige autorização da API do Google e backend.</p></div>`}
async function handleImport(){let f=fileImport.files?.[0];if(!f)return toast('Selecione a planilha');let status=$('#importStatus');status.textContent='Arquivo selecionado: '+f.name+'. Para importar Excel real no navegador, conecte a rotina XLSX no build online.';toast('Arquivo recebido')}
function pageHtml(){switch(page){case'dashboard':return dashboard();case'orders':return ordersPage();case'validate':return validatePage();case'customers':return customersPage();case'stock':return stockPage();case'menu':return menuPage();case'cash':return cashPage();case'expenses':return expensesPage();case'reports':return reportsPage();case'settings':return settingsPage();case'import':return importPage();default:return dashboard()}}
function modal(html,wide=false){modalLayer.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)ADM.closeModal()"><div class="modal ${wide?'wide':''}">${html}</div></div>`}function closeModal(){modalLayer.innerHTML=''}
// CUSTOMER
let cart={};let customerSession=null;
function customerOpen(asAdmin=false){customerSession=getCustomerSession();cart={};renderCustomer(asAdmin)}
function getCustomerSession(){try{return JSON.parse(localStorage.getItem('yas_customer_session')||'null')}catch(e){return null}}
function renderCustomer(asAdmin=false){document.body.classList.toggle('dark',!!D.dark);let ps=D.products.filter(p=>p.active&&p.stock>0);app.innerHTML=`<div class="customer-shell"><div class="customer-top">${brand()}<div class="customer-auth">${customerSession?`<div><b>Olá, ${esc(customerSession.name)}!</b><div class="welcome">Cadastro conectado</div></div><button class="secondary" onclick="Customer.logout(${asAdmin})">Sair</button>`:`<button class="secondary" onclick="Customer.auth(${asAdmin})">Entrar / Cadastrar</button>`}${asAdmin?`<button class="ghost" onclick="ADM.adminView()">← Voltar ao ADM</button>`:''}</div></div><main class="customer-main"><section class="hero"><span class="tag res">${D.config.storeOpen?'Reservas abertas':'Reservas fechadas'}</span><h1>Cardápio de hoje ✨</h1><p>${esc(D.config.customerMessage)}</p></section>${D.config.storeOpen?`<div class="customer-grid" id="customerProducts">${ps.map((p,i)=>productCustomer(p,i)).join('')}</div>${ps.length?'':'<div class="card empty">Hoje não há produtos disponíveis.</div>'}`:'<div class="card empty">As reservas estão fechadas no momento.</div>'}</main>${D.config.storeOpen&&ps.length?`<div class="cartbar"><div class="cartbar-inner"><div><div class="muted"><span id="cartCount">0</span> item(ns)</div><b id="cartTotal">${money(0)}</b></div><button class="primary" onclick="Customer.checkout(${asAdmin})">Finalizar pedido →</button></div></div>`:''}</div>`;updateCart(ps)}
function productCustomer(p,i){return `<div class="product-card"><div style="display:flex;gap:12px"><div class="product-icon">🧁</div><div><b>${esc(p.name)}</b><div class="muted">${p.stock} disponíveis</div><strong>${money(p.price)}</strong></div></div><div class="qty"><button onclick="Customer.qty('${p.id}',-1)">−</button><b id="q-${p.id}">${cart[p.id]||0}</b><button onclick="Customer.qty('${p.id}',1)">+</button></div></div>`}
function qty(id,n){let p=D.products.find(x=>x.id===id);cart[id]=Math.max(0,Math.min(p.stock,(cart[id]||0)+n));let el=$('#q-'+CSS.escape(id));if(el)el.textContent=cart[id];updateCart(D.products.filter(p=>p.active&&p.stock>0))}
function updateCart(ps){let count=ps.reduce((s,p)=>s+(cart[p.id]||0),0),tot=ps.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0);if($('#cartCount'))cartCount.textContent=count;if($('#cartTotal'))cartTotal.textContent=money(tot)}
function auth(asAdmin){modal(`<h2>Entrar ou criar cadastro</h2><div class="two"><div class="card"><h3>Já tenho cadastro</h3><label>E-mail</label><input id="logEmail" type="email" autocomplete="email"><label>Senha</label><input id="logPass" type="password" autocomplete="current-password"><button class="primary" style="width:100%;margin-top:12px" onclick="Customer.doLogin(${asAdmin})">Entrar</button><button class="ghost" style="width:100%;margin-top:8px" onclick="Customer.resetPassword()">🔑 Esqueci minha senha</button></div><div class="card"><h3>Criar cadastro</h3><label>Nome</label><input id="regName"><label>E-mail</label><input id="regEmail" type="email" autocomplete="email"><label>Senha</label><input id="regPass" type="password" autocomplete="new-password"><button class="primary" style="width:100%;margin-top:12px" onclick="Customer.register(${asAdmin})">Cadastrar</button></div></div><p class="muted">O cadastro é opcional. Sem login, o nome será solicitado ao finalizar o pedido.</p>`,true)}
function register(asAdmin){let name=regName.value.trim(),email=regEmail.value.trim().toLowerCase(),pass=regPass.value;if(!name||!email||!pass)return toast('Preencha nome, e-mail e senha');if(D.customerAccounts.some(x=>x.email===email))return toast('Este e-mail já possui cadastro');let a={id:uid('C'),name,email,pass};D.customerAccounts.push(a);save();customerSession={id:a.id,name:a.name,email:a.email};localStorage.setItem('yas_customer_session',JSON.stringify(customerSession));closeModal();renderCustomer(asAdmin);toast('Cadastro criado')}
function doLogin(asAdmin){let email=logEmail.value.trim().toLowerCase(),a=D.customerAccounts.find(x=>x.email===email&&x.pass===logPass.value);if(!a)return toast('E-mail ou senha inválidos');customerSession={id:a.id,name:a.name,email:a.email};localStorage.setItem('yas_customer_session',JSON.stringify(customerSession));closeModal();renderCustomer(asAdmin);toast('Login realizado')}
function resetPassword(){modal(`<h2>🔑 Redefinir senha</h2><p class="muted">Informe o e-mail usado no cadastro e escolha uma nova senha.</p><label>E-mail</label><input id="resetEmail" type="email" autocomplete="email"><label>Nova senha</label><input id="resetPass" type="password" autocomplete="new-password"><label>Confirmar nova senha</label><input id="resetPass2" type="password" autocomplete="new-password"><button class="primary" style="width:100%;margin-top:12px" onclick="Customer.saveResetPassword()">Salvar nova senha</button><p class="muted" style="margin-bottom:0">Nesta versão de teste, a redefinição é feita dentro do próprio sistema. Na versão online, podemos conectar a recuperação por e-mail.</p>`,true)}
function saveResetPassword(){let email=resetEmail.value.trim().toLowerCase(),p=resetPass.value,p2=resetPass2.value,a=D.customerAccounts.find(x=>x.email===email);if(!a)return toast('Não encontramos um cadastro com esse e-mail');if(p.length<4)return toast('A nova senha deve ter pelo menos 4 caracteres');if(p!==p2)return toast('As senhas não conferem');a.pass=p;save();closeModal();toast('Senha redefinida com sucesso')}
function customerLogout(asAdmin){localStorage.removeItem('yas_customer_session');customerSession=null;renderCustomer(asAdmin)}
function checkout(asAdmin){let items=D.products.filter(p=>p.active&&cart[p.id]>0).map(p=>({id:p.id,name:p.name,qty:cart[p.id],price:p.price}));if(!items.length)return toast('Escolha pelo menos um produto');let total=items.reduce((s,i)=>s+i.qty*i.price,0);if(total<D.config.minOrder)return toast('Pedido mínimo: '+money(D.config.minOrder));let nameField=customerSession?'':`<label>Seu nome *</label><input id="checkoutName" placeholder="Nome obrigatório">`;modal(`<h2>Finalizar reserva</h2>${customerSession?`<div class="notice">Pedido vinculado ao cadastro de <b>${esc(customerSession.name)}</b>.</div>`:nameField}<div class="divider"></div>${items.map(i=>`<div class="row"><span>${i.qty}× ${esc(i.name)}</span><b>${money(i.qty*i.price)}</b></div>`).join('')}<div class="row"><b>Total</b><b style="font-size:20px">${money(total)}</b></div><label>Forma de pagamento</label><select id="checkoutPay">${D.config.allowPix?'<option value="PIX">PIX</option>':''}${D.config.allowCash?'<option value="Dinheiro">Dinheiro</option>':''}${D.config.allowLater?'<option value="A pagar depois">A pagar depois</option>':''}</select><button class="primary" style="width:100%;margin-top:12px" onclick="Customer.finish(${asAdmin})">Confirmar reserva</button>`,true)}
function finish(asAdmin){let items=D.products.filter(p=>p.active&&cart[p.id]>0).map(p=>({id:p.id,name:p.name,qty:cart[p.id],price:p.price})),name=customerSession?customerSession.name:(checkoutName?.value||'').trim();if(!name)return toast('O nome é obrigatório');for(let i of items){let p=D.products.find(x=>x.id===i.id);if(!p||p.stock<i.qty)return toast('Estoque insuficiente para '+i.name)}let total=items.reduce((s,i)=>s+i.qty*i.price,0),method=checkoutPay.value,paid=false;items.forEach(i=>{let p=D.products.find(p=>p.id===i.id);let before=p.stock;p.stock-=i.qty;let r=dailyStockRec(isoToday(),i.id);if(!r){r={id:uid('DS'),date:isoToday(),productId:i.id,productName:i.name,produced:before,remaining:p.stock};D.dailyStock.push(r)}else r.remaining=p.stock});let code=`${D.config.orderPrefix||'YD'}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;let o={id:uid('O'),code,clientName:name,customerId:customerSession?.id||null,items,total,status:'Reservado',iso:isoToday(),time:nowTime(),method,paid,source:asAdmin?'admin-as-customer':'customer'};D.orders.push(o);save();closeModal();app.innerHTML=`<div class="customer-shell"><div class="customer-main" style="max-width:680px;padding-top:60px"><div class="card"><div class="brand">${brand()}</div><div style="text-align:center;padding:24px 0"><div style="font-size:54px">🎉</div><h1>Pedido reservado!</h1><p class="muted">Guarde este código. O ADM não vê o código na lista de pedidos.</p><div class="code">${code}</div></div>${items.map(i=>`<div class="row"><span>${i.qty}× ${esc(i.name)}</span><b>${money(i.qty*i.price)}</b></div>`).join('')}<div class="row"><b>Total</b><b>${money(total)}</b></div><p class="muted">Pagamento escolhido: ${esc(method)} · status do pagamento: pendente até confirmação.</p><button class="primary" style="width:100%" onclick="Customer.open(${asAdmin})">Voltar ao cardápio</button>${asAdmin?'<button class="secondary" style="width:100%;margin-top:8px" onclick="ADM.adminView()">Voltar ao ADM</button>':''}</div></div></div>`}
function dailyStockRec(date,pid){return D.dailyStock.find(x=>x.date===date&&x.productId===pid)}
window.ADM={login,adminView,logout,toggleSide,toggleGroup,go,refresh,thisMonth,theme,orderDetail,deleteOrder,togglePaid,checkCode,deliver,customerDetail,filterCustomers,exportCustomerHistory,deleteCustomerAccount,stockStep,saveDailyStock,deleteDailyStockRecord,deleteStockDay,closeStockDay,confirmCloseStockDay,reopenStockDay,stockDayDetail,editProduct,deleteProduct,newProduct,saveProduct,newProduct,saveNewProduct,newExpense,deleteExpense,saveExpense,applyReportFilter,exportReportCSV,toggleCfg:()=>{},saveConfig,saveAdmin,backup,clearOperational,closeModal,handleImport};
window.Customer={open:customerOpen,qty,auth,register,doLogin,resetPassword,saveResetPassword,logout:customerLogout,checkout,finish};
save();
if(new URLSearchParams(location.search).get('cliente')==='1')customerOpen(false);else if(sessionStorage.getItem('yas_admin'))adminView();else loginView();
})();
</script>
</body></html>
