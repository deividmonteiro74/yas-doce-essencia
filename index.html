<style>
:root{

  --blue:#3e7cf4;--cyan:#14a7b7;--orange:#f28b3c;--pink:#e9549f;--shadow:0 14px 35px rgba(73,31,95,.12)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);transition:.25s background,.25s color}button,input,select{font:inherit}
body.dark{--bg:#0d0a12;--surface:#17121e;--surface2:#21172a;--text:#fff7ff;--muted:#cbb9d6;--border:#3b2a48;--primary:#c965ff;--primary2:#e090ff;--primary3:#8d39c0;--shadow:0 18px 44px rgba(0,0,0,.34)}
button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s,opacity .18s;color:inherit}button:hover{transform:translateY(-1px)}button:active{transform:translateY(0) scale(.98)}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(140,60,194,.22)}
.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);font-weight:700}.success{background:var(--success);color:white;font-weight:800}.danger{background:var(--danger);color:#fff;font-weight:800}.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
body.dark .secondary,body.dark .ghost{background:#271c31;color:#fff;border-color:#513b61}body.dark .secondary:hover,body.dark .ghost:hover{background:#342340}body.dark .primary{box-shadow:0 10px 26px rgba(201,101,255,.26)}
input,select{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px 12px;outline:none;transition:.2s}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(140,60,194,.13)}
label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin:10px 0 6px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#d491ef 0,transparent 28%),radial-gradient(circle at 88% 16%,#8647d6 0,transparent 30%),linear-gradient(135deg,#4f176f,#a23cc3 52%,#e588f4)}
.login-card{width:min(430px,100%);background:rgba(255,255,255,.96);padding:28px;border-radius:28px;box-shadow:0 28px 90px rgba(0,0,0,.28);animation:pop .45s ease}body.dark .login-card{background:#18111f;color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:11px}.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-size:23px;box-shadow:0 10px 24px rgba(140,60,194,.25)}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted);margin-top:2px}
.topbar{height:70px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:50}.top-actions{display:flex;gap:8px;align-items:center}.icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:18px}
.shell{display:flex;min-height:calc(100vh - 70px)}.sidebar{width:265px;background:var(--surface);border-right:1px solid var(--border);padding:12px;transition:.26s width,.26s transform;overflow:hidden}.sidebar.hidden{width:0;padding-left:0;padding-right:0;border-right:0}.side-title{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 10px 6px}.nav-main{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;color:var(--text);font-weight:850;padding:11px 10px}.nav-main:hover,.nav-main.active{background:var(--surface2)}.nav-main span:first-child{display:flex;align-items:center;gap:9px}.nav-sub{display:none;padding:2px 0 7px 12px;animation:slide .18s ease}.nav-sub.open{display:block}.nav-sub button{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);padding:9px 10px}.nav-sub button:hover,.nav-sub button.active{background:var(--surface2);color:var(--text);font-weight:800}.chev{transition:.2s}.open-parent .chev{transform:rotate(90deg)}
@keyframes slide{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.content{flex:1;min-width:0;padding:22px;max-width:1600px;margin:0 auto;width:100%}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}.page-head h1{margin:0;font-size:27px}.page-head p{margin:4px 0 0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:fadeUp .35s ease both}.kpi:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-28px;top:-30px;background:var(--accent,#8c3cc2);opacity:.12}.kpi .label{color:var(--muted);font-size:12px;font-weight:800}.kpi .value{font-size:26px;font-weight:950;margin:6px 0}.kpi .delta{font-size:12px;font-weight:800}.up{color:var(--success)}.down{color:var(--danger)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px;animation:fadeUp .35s ease both}.card h3{margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.muted{color:var(--muted);font-size:12px}.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900;background:var(--surface2)}.tag.ok{background:rgba(15,166,109,.13);color:var(--success)}.tag.warn{background:rgba(230,160,0,.14);color:#b57800}.tag.res{background:rgba(140,60,194,.13);color:var(--primary)}.tag.bad{background:rgba(212,69,98,.13);color:var(--danger)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--border);font-size:13px;text-align:left}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.clickable{cursor:pointer}.clickable:hover{background:var(--surface2)}
.filters{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.filters>div{min-width:150px;flex:1}.filters .small{flex:0 0 auto;min-width:auto}
.chart-box{min-height:250px;position:relative}.bar-chart{display:flex;align-items:flex-end;gap:10px;height:210px;padding:15px 5px 28px;border-bottom:1px solid var(--border)}.bar-col{flex:1;min-width:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}.bar{width:min(46px,82%);border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--accent,var(--primary2)),var(--primary));min-height:4px;transform-origin:bottom;animation:grow .65s cubic-bezier(.2,.8,.2,1)}.bar-col small{color:var(--muted);font-size:10px;white-space:nowrap}.bar-col b{font-size:10px}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.line-svg{width:100%;height:220px}.line-grid{stroke:var(--border);stroke-width:1}.line-path{fill:none;stroke:var(--primary2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1s forwards}.line-dot{fill:var(--surface);stroke:var(--primary);stroke-width:3}@keyframes draw{to{stroke-dashoffset:0}}
.donut-wrap{display:grid;place-items:center;min-height:220px}.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--success) 0 var(--paid),var(--warning) var(--paid) 100%);position:relative;display:grid;place-items:center}.donut:after{content:"";position:absolute;width:105px;height:105px;border-radius:50%;background:var(--surface)}.donut-label{position:relative;z-index:1;text-align:center}.donut-label b{font-size:24px;display:block}
.modal-layer{position:fixed;inset:0;z-index:1000;pointer-events:none}.modal-bg{position:absolute;inset:0;background:rgba(9,5,12,.55);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;pointer-events:auto;animation:fade .2s}.modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 30px 100px rgba(0,0,0,.35);animation:pop .2s}.modal.wide{width:min(980px,100%)}@keyframes fade{from{opacity:0}to{opacity:1}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.divider{height:1px;background:var(--border);margin:15px 0}.empty{text-align:center;padding:40px 16px;color:var(--muted)}
/* customer */
.customer-shell{min-height:100vh;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 10%,var(--bg)),var(--bg) 320px)}.customer-top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;max-width:1100px;margin:auto}.customer-main{max-width:1100px;margin:auto;padding:10px 18px 110px}.hero{padding:26px 0 18px}.hero h1{font-size:34px;margin:12px 0 6px}.hero p{color:var(--muted);max-width:650px}.customer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.product-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:12px;transition:.2s;animation:fadeUp .35s both}.product-card:hover{transform:translateY(-2px)}.product-icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--surface2),color-mix(in srgb,var(--primary) 15%,var(--surface)));font-size:25px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:34px;height:34px;padding:0;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-weight:900;font-size:18px}.qty b{min-width:18px;text-align:center}.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:11px 18px}.cartbar-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.cartbar .primary{min-width:180px}.customer-auth{display:flex;gap:8px}.welcome{font-size:12px;color:var(--muted)}
.code{font-size:34px;font-weight:1000;letter-spacing:.12em;text-align:center;background:var(--surface2);border:1px dashed var(--primary);padding:18px;border-radius:18px;color:var(--primary)}
.import-shortcut{display:flex;align-items:center;justify-content:space-between;gap:14px}.upload-zone{border:2px dashed var(--border);border-radius:18px;padding:26px;text-align:center;background:var(--surface2);transition:.2s}.upload-zone.drag{border-color:var(--primary);transform:scale(1.01)}.upload-zone input{display:block;width:100%;margin-top:14px;padding:10px;border:1px dashed var(--primary);background:var(--surface);cursor:pointer}.upload-zone .file-picker{display:block!important;position:static!important;width:100%!important;height:auto!important;opacity:1!important;pointer-events:auto!important;margin:14px 0 6px!important;padding:12px!important;border:1px solid var(--border)!important;border-radius:12px!important;background:var(--surface)!important;color:var(--text)!important}.file-label{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}.file-label:focus,.file-label:hover{transform:translateY(-1px)}.upload-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.upload-zone .big{font-size:32px}.notice{padding:12px 14px;border-radius:14px;background:rgba(62,124,244,.10);border:1px solid rgba(62,124,244,.22);font-size:13px}.toast{position:fixed;right:18px;bottom:18px;z-index:2000;background:var(--text);color:var(--surface);padding:12px 16px;border-radius:13px;box-shadow:var(--shadow);animation:pop .25s}

document.getElementById('favicon').href=LOGO_SRC;
function brand(){return `<div class="brand"><div class="mark"><img src="${LOGO_SRC}" alt="Logo" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div><div><strong>${esc(D.config.storeName)}</strong><small>${esc(D.config.slogan)}</small></div></div>`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function inRange(iso){return (!filter.from||iso>=filter.from)&&(!filter.to||iso<=filter.to)}
function orderPaidTotal(o){return o.paid?o.total:0}
function filteredOrders(){return D.orders.filter(o=>inRange(o.iso)&&(filter.payment==='all'||(filter.payment==='paid'?o.paid:!o.paid)))}
function expenseFiltered(){return D.expenses.filter(x=>inRange(x.iso))}
function revenue(){return filteredOrders().reduce((s,o)=>s+o.total,0)}
function received(){return filteredOrders().reduce((s,o)=>s+orderPaidTotal(o),0)}
function expensesTotal(){return expenseFiltered().reduce((s,x)=>s+Number(x.value||0),0)}
function profit(){return received()-expensesTotal()}
function prevMonthCompare(metric){let start=new Date(filter.from||firstDay());let y=start.getFullYear(),m=start.getMonth();let ps=new Date(y,m-1,1),pe=new Date(y,m,0);let pf=`${ps.getFullYear()}-${String(ps.getMonth()+1).padStart(2,'0')}-${String(ps.getDate()).padStart(2,'0')}`,pt=`${pe.getFullYear()}-${String(pe.getMonth()+1).padStart(2,'0')}-${String(pe.getDate()).padStart(2,'0')}`;let os=D.orders.filter(o=>o.iso>=pf&&o.iso<=pt),ex=D.expenses.filter(x=>x.iso>=pf&&x.iso<=pt);let prev=metric==='faturamento'?os.reduce((s,o)=>s+o.total,0):metric==='recebido'?os.reduce((s,o)=>s+(o.paid?o.total:0),0):metric==='despesa'?ex.reduce((s,x)=>s+Number(x.value||0),0):os.reduce((s,o)=>s+(o.paid?o.total:0),0)-ex.reduce((s,x)=>s+Number(x.value||0),0);let cur=metric==='faturamento'?revenue():metric==='recebido'?received():metric==='despesa'?expensesTotal():profit();let pct=prev===0?(cur===0?0:100):((cur-prev)/Math.abs(prev))*100;return {prev,cur,pct}}
function loginView(){document.body.classList.toggle('dark',!!D.dark);app.innerHTML=`<section class="login"><div class="login-card">${brand()}<h1 style="margin:22px 0 6px">Seja bem-vindo(a)! 💜</h1><p class="muted" style="margin-top:0">${esc(D.config.customerMessage)}</p><button class="primary" style="width:100%;font-size:15px;padding:14px" onclick="Customer.open(false)">🛒 Fazer pedido sem cadastro</button><div class="divider"></div><button class="secondary" style="width:100%" onclick="ADM.openAdminLogin()">🔐 Entrar</button></div></section>`}
function login(){if(admUser.value===D.admin.user&&admPass.value===D.admin.pass){sessionStorage.setItem('yas_admin','1');closeModal();adminView()}else toast('Usuário ou senha inválidos')}
function openAdminLogin(){modal(`<h2>🔐 Entrar</h2><p class="muted">Acesso exclusivo da administração.</p><label>Usuário</label><input id="admUser" autocomplete="username"><label>Senha</label><input id="admPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')ADM.login()"><button class="primary" style="width:100%;margin-top:14px" onclick="ADM.login()">Entrar</button>`)}
function adminView(){document.body.classList.toggle('dark',!!D.dark);app.innerHTML=`<header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="icon-btn" onclick="ADM.toggleSide()">☰</button>${brand()}</div><div class="top-actions"><button class="secondary" onclick="Customer.open(true)" title="Use para lançar o pedido de alguém que não tem o link do site">🛒 Fazer pedido p/ cliente</button><button class="icon-btn" title="Tema" onclick="ADM.theme()">${D.dark?'☀️':'🌙'}</button><button class="icon-btn" title="Sair" onclick="ADM.logout()">↪</button></div></header><div class="shell"><aside class="sidebar" id="side">${nav()}</aside><main class="content" id="content"></main></div>`;go(route)}
function nav(){return `<button class="nav-main" onclick="ADM.go('dashboard')"><span>📊 Dashboard</span></button>
${navGroup('op','🧾 Operação',[['orders','Pedidos'],['validate','Validar / liberar'],['customers','Clientes']])}
${navGroup('cat','🍰 Catálogo',[['stock','Estoque do dia'],['menu','Cardápio']])}
${navGroup('fin','💰 Financeiro',[['cash','Caixa'],['expenses','Despesas'],['reports','Relatórios']])}
${navGroup('sys','⚙️ Sistema',[['settings','Configurações'],['import','📥 Importar planilha']])}`}
function navGroup(id,label,items){return `<div class="group"><button class="nav-main" onclick="ADM.toggleGroup('${id}',this)"><span>${label}</span><span class="chev">›</span></button><div class="nav-sub" id="g-${id}">${items.map(x=>`<button onclick="ADM.go('${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}
function toggleGroup(id,btn){let e=$('#g-'+id);e.classList.toggle('open');btn.classList.toggle('open-parent')}
function toggleSide(){$('#side').classList.toggle('hidden')}
function go(r){route=r;({dashboard,orders,validate,customers,stock,menu,cash,expenses,reports,settings,importSpreadsheet}[r]||dashboard)();if(innerWidth<980&&$('#side'))$('#side').classList.add('hidden')}
function head(title,sub,action=''){content.innerHTML=`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div>${action}</div></div>`}
function filterUI(onchange='ADM.refresh()'){return `<div class="card"><div class="filters"><div><label>De</label><input id="fFrom" type="date" value="${filter.from}" onchange="${onchange}"></div><div><label>Até</label><input id="fTo" type="date" value="${filter.to}" onchange="${onchange}"></div><div class="small"><button class="secondary" onclick="ADM.thisMonth()">Este mês</button></div></div></div>`}
function syncFilter(){if($('#fFrom'))filter.from=$('#fFrom').value;if($('#fTo'))filter.to=$('#fTo').value}
function refresh(){syncFilter();go(route)}function thisMonth(){filter.from=firstDay();filter.to=isoToday();go(route)}
function kpi(label,value,color,cmp){let c=cmp||{pct:0};return `<div class="kpi" style="--accent:${color}"><div class="label">${label}</div><div class="value">${value}</div><div class="delta ${c.pct>=0?'up':'down'}">${c.pct>=0?'▲':'▼'} ${Math.abs(c.pct).toFixed(1)}% vs. mês anterior</div></div>`}
function dashboard(){head('Dashboard','Visão rápida do seu negócio','<input id="dashboardImportFile" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="max-width:330px;padding:10px;border:1px solid var(--primary);border-radius:12px;background:var(--surface);color:var(--text);font-weight:700">');content.innerHTML+=filterUI();let c1=prevMonthCompare('faturamento'),c2=prevMonthCompare('recebido'),c3=prevMonthCompare('despesa'),c4=prevMonthCompare('lucro');content.innerHTML+=`<div class="cards">${kpi('Faturamento',money(revenue()),'var(--blue)',c1)}${kpi('Recebido',money(received()),'var(--success)',c2)}${kpi('Despesas',money(expensesTotal()),'var(--orange)',c3)}${kpi('Resultado',money(profit()),'var(--pink)',c4)}</div><div class="grid2"><div class="card"><h3>Faturamento mensal</h3><div id="lineChart" class="chart-box"></div></div><div class="card"><h3>Pagamentos</h3><div id="donutChart"></div></div></div><div class="grid2"><div class="card"><h3>Produtos mais vendidos</h3><div id="barChart"></div></div><div class="card"><h3>Estoque atual</h3>${stockMini()}</div></div>`;drawMonthlyLine('lineChart');drawDonut('donutChart');drawTopProducts('barChart');let df=$('#dashboardImportFile');if(df)df.addEventListener('change',e=>{let file=e.target.files&&e.target.files[0];if(file){go('import');setTimeout(()=>handleImport(file),0)}})}
function stockMini(){let ps=D.products.slice().sort((a,b)=>a.stock-b.stock).slice(0,6);return ps.length?ps.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)}</div></div><span class="tag ${p.stock<=3?'bad':p.stock<=7?'warn':'ok'}">${p.stock} un.</span></div>`).join(''):'<div class="empty">Nenhum produto cadastrado.</div>'}
function monthKey(iso){return iso?.slice(0,7)}function monthLabel(k){let[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})}
function monthlySeries(n=6){let out=[];let d=new Date();for(let i=n-1;i>=0;i--){let x=new Date(d.getFullYear(),d.getMonth()-i,1),k=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;let os=D.orders.filter(o=>monthKey(o.iso)===k),ex=D.expenses.filter(e=>monthKey(e.iso)===k);out.push({k,label:monthLabel(k),revenue:os.reduce((s,o)=>s+o.total,0),received:os.reduce((s,o)=>s+(o.paid?o.total:0),0),expenses:ex.reduce((s,e)=>s+Number(e.value||0),0)})}return out}
function drawMonthlyLine(id){let data=monthlySeries(6),w=620,h=210,p=25,max=Math.max(1,...data.map(x=>x.revenue));let pts=data.map((x,i)=>`${p+i*(w-2*p)/(data.length-1)},${h-p-(x.revenue/max)*(h-2*p)}`).join(' ');let grid=[.25,.5,.75,1].map(v=>`<line x1="${p}" y1="${h-p-v*(h-2*p)}" x2="${w-p}" y2="${h-p-v*(h-2*p)}" class="line-grid"/>`).join('');let dots=data.map((x,i)=>{let cx=p+i*(w-2*p)/(data.length-1),cy=h-p-(x.revenue/max)*(h-2*p);return `<circle cx="${cx}" cy="${cy}" r="5" class="line-dot"><title>${x.label}: ${money(x.revenue)}</title></circle><text x="${cx}" y="${h-5}" text-anchor="middle" fill="var(--muted)" font-size="10">${x.label}</text>`}).join('');$('#'+id).innerHTML=`<svg viewBox="0 0 ${w} ${h}" class="line-svg">${grid}<polyline points="${pts}" class="line-path"/>${dots}</svg>`}
function drawDonut(id){let os=filteredOrders(),paid=os.filter(o=>o.paid).reduce((s,o)=>s+o.total,0),total=os.reduce((s,o)=>s+o.total,0),pct=total?Math.round(paid/total*100):0;$('#'+id).innerHTML=`<div class="donut-wrap"><div class="donut" style="--paid:${pct}%"><div class="donut-label"><b>${pct}%</b><span class="muted">recebido</span></div></div><div style="margin-top:12px" class="muted">Recebido ${money(paid)} · Pendente ${money(total-paid)}</div></div>`}
function productStats(){let m={};filteredOrders().forEach(o=>o.items.forEach(i=>m[i.name]=(m[i.name]||0)+i.qty));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function drawTopProducts(id){let a=productStats().slice(0,7),max=Math.max(1,...a.map(x=>x[1]));$('#'+id).innerHTML=a.length?`<div class="bar-chart">${a.map((x,i)=>`<div class="bar-col"><b>${x[1]}</b><div class="bar" style="height:${Math.max(6,x[1]/max*150)}px;--accent:${['var(--primary2)','var(--blue)','var(--cyan)','var(--pink)','var(--orange)'][i%5]}"></div><small title="${esc(x[0])}">${esc(x[0].slice(0,10))}</small></div>`).join('')}</div>`:'<div class="empty">Sem vendas no período.</div>'}
function orders(){head('Pedidos','Reservas dos clientes. O código não é exibido ao ADM.','<button class="primary" onclick="Customer.open(true)">+ Fazer pedido como cliente</button>');content.innerHTML+=filterUI();let os=filteredOrders().slice().sort((a,b)=>(b.iso+b.time).localeCompare(a.iso+a.time));content.innerHTML+=`<div class="card table-wrap"><table class="table"><thead><tr><th>Data</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Pagamento</th><th>Status</th><th>Ação</th></tr></thead><tbody>${os.map((o,i)=>`<tr class="clickable" onclick="ADM.orderDetail('${o.id}')"><td>${brDate(o.iso)} ${o.time}</td><td><b>${esc(o.clientName)}</b></td><td>${o.items.reduce((s,x)=>s+x.qty,0)} item(ns)</td><td><b>${money(o.total)}</b></td><td><span class="tag ${o.paid?'ok':'warn'}">${o.paid?'Pago':'Pendente'}</span></td><td><span class="tag ${o.status==='Entregue'?'ok':'res'}">${o.status}</span></td><td><button class="danger" onclick="event.stopPropagation();ADM.deleteOrder('${o.id}')">Excluir</button></td></tr>`).join('')}</tbody></table>${os.length?'':'<div class="empty">Nenhum pedido no período.</div>'}</div>`}
function orderDetail(id){let o=D.orders.find(x=>x.id===id);if(!o)return;modal(`<h2>Pedido de ${esc(o.clientName)}</h2><p class="muted">${brDate(o.iso)} às ${o.time} · código protegido</p>${o.items.map(i=>`<div class="row"><span>${i.qty}× ${esc(i.name)}</span><b>${money(i.price*i.qty)}</b></div>`).join('')}<div class="row"><b>Total</b><b>${money(o.total)}</b></div><div class="two"><div><label>Pagamento</label><button class="${o.paid?'success':'secondary'}" style="width:100%" onclick="ADM.togglePaid('${o.id}')">${o.paid?'✓ Pago':'Marcar como pago'}</button></div><div><label>Status</label><div class="tag ${o.status==='Entregue'?'ok':'res'}">${o.status}</div></div></div>`,true)}
function deleteOrder(id){let o=D.orders.find(x=>x.id===id);if(!o)return;if(!confirm('Tem certeza que deseja excluir este pedido?\n\nEsta ação não pode ser desfeita.'))return;D.orders=D.orders.filter(x=>x.id!==id);save();closeModal();orders();toast('Pedido excluído')}
function togglePaid(id){let o=D.orders.find(x=>x.id===id);if(!o)return;o.paid=!o.paid;save();closeModal();orders();toast(o.paid?'Pagamento confirmado':'Pagamento marcado como pendente')}
function validate(){head('Validar / liberar pedido','Digite o código apresentado pelo cliente para concluir a retirada.');content.innerHTML+=`<div class="card" style="max-width:720px"><h3>🔐 Código do cliente</h3><p class="muted">O código não aparece na lista administrativa. Ele é validado apenas aqui.</p><div style="display:flex;gap:9px"><input id="codeInput" placeholder="Ex.: YD-A1B2C" style="text-transform:uppercase"><button class="primary" onclick="ADM.checkCode()">Validar</button></div><div id="validResult" style="margin-top:14px"></div></div>`}
function checkCode(){let code=codeInput.value.trim().toUpperCase(),o=D.orders.find(x=>x.code===code);if(!o){validResult.innerHTML='<div class="notice" style="border-color:rgba(212,69,98,.3);background:rgba(212,69,98,.08)">❌ Código não encontrado.</div>';return}if(o.status==='Entregue'){validResult.innerHTML='<div class="notice">ℹ️ Este pedido já foi entregue.</div>';return}validResult.innerHTML=`<div class="card"><h3>${esc(o.clientName)}</h3>${o.items.map(i=>`<div class="row"><span>${i.qty}× ${esc(i.name)}</span><b>${money(i.qty*i.price)}</b></div>`).join('')}<div class="row"><b>Total</b><b>${money(o.total)}</b></div><p><span class="tag ${o.paid?'ok':'warn'}">${o.paid?'Pago':'Pagamento pendente'}</span></p><button class="success" style="width:100%" onclick="ADM.deliver('${o.id}')">✓ Confirmar retirada / Entregue</button></div>`}
function deliver(id){let o=D.orders.find(x=>x.id===id);if(!o)return;o.status='Entregue';o.deliveredAt=new Date().toISOString();save();validate();toast('Pedido marcado como entregue')}
function customers(){head('Clientes','Pesquise um cliente e veja somente o histórico dele, com opção de exportar compras concluídas, pendentes ou ambos.');let names=[...new Map(D.orders.map(o=>[normalize(o.clientName),o.clientName])).values()].sort((a,b)=>a.localeCompare(b));content.innerHTML+=`<div class="card"><div class="filters"><div style="flex:2;min-width:220px"><label>🔎 Pesquisar cliente</label><input id="customerSearch" placeholder="Digite o nome do cliente..." oninput="ADM.filterCustomers()"></div><div><label>Status do pagamento</label><select id="customerStatus" onchange="ADM.filterCustomers()"><option value="all">Todos</option><option value="paid">Concluídos / Pagos</option><option value="pending">Pendentes</option></select></div></div><div id="customerResults" style="margin-top:12px"></div></div>`;ADM.filterCustomers()}
function pendingOrdersFor(name){return D.orders.filter(o=>normalize(o.clientName)===normalize(name)&&!o.paid).sort((a,b)=>(a.iso+a.time).localeCompare(b.iso+b.time))}
function chargeMessage(name,pending){let total=pending.reduce((s,o)=>s+Number(o.total||0),0);let blocks=pending.map(o=>`📅 Data do pedido: ${brDate(o.iso)}\n🍰 Pedido: ${o.items.map(i=>`${i.qty}x ${i.name}`).join(', ')}\n💰 Valor: ${money(o.total)}`).join('\n\n');return `Olá, ${name}! Tudo bem? 😊\n\nIdentificamos um pagamento em aberto referente aos seus pedidos na ${D.config.storeName}.\n\n${blocks}\n\n💳 Total em aberto: ${money(total)}\n\nPedimos, por gentileza, que verifique o pagamento.\nObrigado! 💜\n\n${D.config.storeName}`}
function openCharge(enc){let name=decodeURIComponent(enc),pending=pendingOrdersFor(name);if(!pending.length)return toast('Este cliente não possui pendência');let msg=chargeMessage(name,pending);window._chargeMsg=msg;modal(`<h2>💬 Cobrança em aberto</h2><p class="muted">Somente ADM. Revise a mensagem abaixo e copie para enviar manualmente pelo WhatsApp. Nada é enviado automaticamente.</p><div class="notice" style="white-space:pre-wrap">${esc(msg)}</div><button class="primary" style="width:100%;margin-top:12px" onclick="ADM.copyChargeMessage()">📋 Copiar mensagem</button>`,true)}
function copyChargeMessage(){let msg=window._chargeMsg||'';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(()=>toast('Mensagem copiada')).catch(()=>fallbackCopy(msg))}else fallbackCopy(msg)}
function fallbackCopy(msg){let ta=document.createElement('textarea');ta.value=msg;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');toast('Mensagem copiada')}catch(e){toast('Não foi possível copiar automaticamente; selecione o texto manualmente')}document.body.removeChild(ta)}
function filterCustomers(){let q=normalize($('#customerSearch')?.value||''),st=$('#customerStatus')?.value||'all',map={};D.orders.forEach(o=>{if(st==='paid'&&!o.paid)return;if(st==='pending'&&o.paid)return;if(q&&!normalize(o.clientName).includes(q))return;let k=o.customerId||normalize(o.clientName);if(!map[k])map[k]={name:o.clientName,orders:[],total:0,paid:0,pending:0};map[k].orders.push(o);map[k].total+=Number(o.total||0);if(o.paid)map[k].paid+=Number(o.total||0);else map[k].pending+=Number(o.total||0)});let arr=Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));$('#customerResults').innerHTML=arr.length?arr.map(c=>`<div class="row clickable" onclick="ADM.customerDetail('${encodeURIComponent(c.name)}')"><div><b>${esc(c.name)}</b><div class="muted">${c.orders.length} pedido(s) · Pago ${money(c.paid)} · Pendente ${money(c.pending)}</div></div><div style="text-align:right"><b>${money(c.total)}</b><div style="display:flex;gap:6px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap">${c.pending>0?`<button class="secondary" style="background:rgba(230,160,0,.14);color:#b57800" onclick="event.stopPropagation();ADM.openCharge('${encodeURIComponent(c.name)}')">💬 Cobrança</button>`:`<button class="ghost" disabled onclick="event.stopPropagation()">💬 Sem pendência</button>`}<button class="secondary" onclick="event.stopPropagation();ADM.customerDetail('${encodeURIComponent(c.name)}')">Histórico</button><button class="primary" onclick="event.stopPropagation();ADM.exportCustomerHistory('${encodeURIComponent(c.name)}')">⬇ Exportar</button></div></div></div>`).join(''):'<div class="empty">Nenhum cliente encontrado.</div>'}
function customerDetail(enc){let name=decodeURIComponent(enc),os=D.orders.filter(o=>normalize(o.clientName)===normalize(name)).sort((a,b)=>(b.iso+b.time).localeCompare(a.iso+a.time));let byDay={};os.forEach(o=>(byDay[o.iso]??=[]).push(o));modal(`<h2>Histórico — ${esc(name)}</h2><p class="muted">${os.length} pedido(s). Filtre e exporte o histórico por status de pagamento.</p><div class="filters"><div><label>Exportar</label><select id="customerExportStatus"><option value="all">Compras concluídas + pendentes</option><option value="paid">Somente concluídos / pagos</option><option value="pending">Somente pendentes</option></select></div><div class="small"><button class="primary" onclick="ADM.exportCustomerHistory('${encodeURIComponent(name)}')">⬇ Exportar histórico</button></div></div>${(()=>{let pend=os.filter(o=>!o.paid).reduce((s,o)=>s+Number(o.total||0),0);return pend>0?`<button class="secondary" style="margin:8px 8px 0 0;background:rgba(230,160,0,.14);color:#b57800" onclick="ADM.openCharge('${encodeURIComponent(name)}')">💬 Cobrança em aberto — ${money(pend)}</button>`:''})()}${(()=>{let a=D.customerAccounts.find(x=>normalize(x.name)===normalize(name));return a?`<button class="danger" style="margin:8px 0" onclick="ADM.deleteCustomerAccount('${a.id}')">🗑 Excluir cadastro do cliente</button>`:''})()}${Object.entries(byDay).map(([d,a])=>{let t=a.reduce((s,o)=>s+o.total,0),p=a.reduce((s,o)=>s+(o.paid?o.total:0),0);return `<div class="card"><div class="row"><div><b>${brDate(d)}</b><div class="muted">${a.length} pedido(s)</div></div><div><b>${money(t)}</b><div class="muted">Pago ${money(p)} · Pendente ${money(t-p)}</div></div></div>${a.map(o=>`<div class="row clickable" onclick="ADM.closeModal();ADM.orderDetail('${o.id}')"><div><b>${o.time}</b><div class="muted">${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(' · ')}</div></div><div style="text-align:right"><b>${money(o.total)}</b><br><span class="tag ${o.paid?'ok':'warn'}">${o.paid?'Pago':'Pendente'}</span><span class="tag ${o.status==='Entregue'?'ok':'res'}" style="margin-left:5px">${o.status}</span></div></div>`).join('')}</div>`}).join('')}`,true)}
function exportCustomerHistory(enc){let name=decodeURIComponent(enc),st=$('#customerExportStatus')?.value||'all',os=D.orders.filter(o=>normalize(o.clientName)===normalize(name)&& (st==='all'||(st==='paid'&&o.paid)||(st==='pending'&&!o.paid))).sort((a,b)=>(a.iso+a.time).localeCompare(b.iso+b.time));let rows=[['Data','Hora','Cliente','Produtos','Quantidade','Total','Pagamento','Status do pagamento','Status do pedido','Vencimento']];os.forEach(o=>rows.push([o.iso,o.time,o.clientName,o.items.map(i=>i.name).join(' | '),o.items.reduce((s,i)=>s+i.qty,0),Number(o.total||0),o.method||'',o.paid?'Pago':'Pendente',o.status||'',o.due||'']));let label=st==='paid'?'concluidos':st==='pending'?'pendentes':'compras';downloadText('historico-'+normalize(name).replace(/[^a-z0-9]+/gi,'-')+'-'+label+'.csv',rows.map(r=>r.map(csvCell).join(';')).join('\n'),'text/csv;charset=utf-8');toast('Histórico exportado')}
function deleteCustomerAccount(id){let a=D.customerAccounts.find(x=>x.id===id);if(!a)return;if(!confirm('Excluir o cadastro deste cliente?\n\nO histórico de pedidos será mantido.'))return;D.customerAccounts=D.customerAccounts.filter(x=>x.id!==id);save();closeModal();customers();toast('Cadastro excluído; histórico preservado')}
function normalize(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function dailyStockRec(date,id){return D.dailyStock.find(x=>x.date===date&&x.productId===id)}
function dailyStockRows(date){return D.dailyStock.filter(x=>x.date===date)}
function stockClosing(date){return D.stockClosings.find(x=>x.date===date)}
function dailyProduced(date,id){let r=dailyStockRec(date,id);return r?Number(r.produced||0):0}
function dailyRemaining(date,id){let r=dailyStockRec(date,id);return r?Number(r.remaining||0):(date===isoToday()?(D.products.find(p=>p.id===id)?.stock||0):0)}
function saveDailyStock(){let date=stockDate.value||isoToday();D.products.forEach(p=>{let el=document.getElementById('ds-'+p.id);if(!el)return;let qty=Math.max(0,Number(el.value||0));let r=dailyStockRec(date,p.id);if(r){let sold=Math.max(0,Number(r.produced||0)-Number(r.remaining||0));r.produced=qty;r.remaining=Math.max(0,qty-sold);r.productName=p.name}else D.dailyStock.push({id:uid('DS'),date,productId:p.id,productName:p.name,produced:qty,remaining:qty});if(date===isoToday()){let rr=dailyStockRec(date,p.id);p.stock=Number(rr?.remaining||0)}});D.stockClosings=D.stockClosings.filter(x=>x.date!==date);save();stock();toast('Estoque do dia registrado')}
function deleteDailyStockRecord(id){let r=D.dailyStock.find(x=>x.id===id);if(!r)return;if(!confirm(`Excluir o lançamento de ${r.productName} em ${brDate(r.date)}?\n\nEsta ação não pode ser desfeita.`))return;D.dailyStock=D.dailyStock.filter(x=>x.id!==id);if(r.date===isoToday()){let p=D.products.find(x=>x.id===r.productId);if(p)p.stock=0}if(!dailyStockRows(r.date).length)D.stockClosings=D.stockClosings.filter(x=>x.date!==r.date);save();stock();toast('Lançamento de estoque excluído')}
function deleteStockDay(date){let rows=dailyStockRows(date);if(!rows.length)return;if(!confirm(`Excluir TODO o estoque lançado em ${brDate(date)}?\n\nSerão removidos ${rows.length} produto(s) deste dia.`))return;D.dailyStock=D.dailyStock.filter(x=>x.date!==date);D.stockClosings=D.stockClosings.filter(x=>x.date!==date);if(date===isoToday())rows.forEach(r=>{let p=D.products.find(x=>x.id===r.productId);if(p)p.stock=0});save();stock();toast('Estoque do dia excluído')}
function closeStockDay(date){let rows=dailyStockRows(date).filter(r=>Number(r.produced||0)>0);if(!rows.length)return toast('Registre primeiro o que você levou para vender neste dia');let closed=stockClosing(date);modal(`<h2>🔒 Fechar estoque — ${brDate(date)}</h2><p class="muted">Informe quanto sobrou de cada produto. O sistema calcula automaticamente a saída/venda do dia.</p>${rows.map(r=>`<div class="row"><div><b>${esc(r.productName)}</b><div class="muted">Levado: ${Number(r.produced||0)}</div></div><div style="width:150px"><label style="margin:0 0 4px">Sobrou</label><input id="close-${r.id}" type="number" min="0" max="${Number(r.produced||0)}" value="${closed?Number(r.remaining||0):Number(r.remaining||0)}"></div></div>`).join('')}<button class="primary" style="width:100%;margin-top:14px" onclick="ADM.confirmCloseStockDay('${date}')">Fechar estoque deste dia</button>`) }
function confirmCloseStockDay(date){let rows=dailyStockRows(date).filter(r=>Number(r.produced||0)>0);for(let r of rows){let el=document.getElementById('close-'+r.id),v=Math.max(0,Number(el?.value||0));if(v>Number(r.produced||0))return toast('O restante não pode ser maior que o levado');r.remaining=v;if(date===isoToday()){let p=D.products.find(x=>x.id===r.productId);if(p)p.stock=v}}let c=stockClosing(date);if(c){c.closedAt=new Date().toISOString()}else D.stockClosings.push({id:uid('SC'),date,closedAt:new Date().toISOString()});save();closeModal();stock();toast('Estoque do dia fechado')}
function reopenStockDay(date){if(!stockClosing(date))return;if(!confirm(`Reabrir o estoque de ${brDate(date)} para correção?`))return;D.stockClosings=D.stockClosings.filter(x=>x.date!==date);save();stock();toast('Estoque reaberto para edição')}
function stockDayDetail(date){let rows=dailyStockRows(date).slice().sort((a,b)=>a.productName.localeCompare(b.productName));let c=stockClosing(date);let prod=rows.reduce((s,r)=>s+Number(r.produced||0),0),rem=rows.reduce((s,r)=>s+Number(r.remaining||0),0);modal(`<h2>📦 Estoque de ${brDate(date)}</h2><div class="row"><div><span class="tag ${c?'ok':'warn'}">${c?'Fechado':'Aberto'}</span></div><div><b>${prod} levados · ${Math.max(0,prod-rem)} saídas · ${rem} restantes</b></div></div>${rows.map(r=>`<div class="card" style="margin:10px 0"><div class="row"><div><b>${esc(r.productName)}</b><div class="muted">Levado ${Number(r.produced||0)} · Saída ${Math.max(0,Number(r.produced||0)-Number(r.remaining||0))} · Restante ${Number(r.remaining||0)}</div></div><button class="danger" onclick="ADM.deleteDailyStockRecord('${r.id}');ADM.closeModal()">Excluir</button></div></div>`).join('')}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${c?`<button class="secondary" onclick="ADM.reopenStockDay('${date}');ADM.closeModal()">Reabrir para corrigir</button>`:`<button class="primary" onclick="ADM.closeModal();ADM.closeStockDay('${date}')">Fechar este dia</button>`}<button class="danger" onclick="ADM.deleteStockDay('${date}');ADM.closeModal()">Excluir dia inteiro</button></div>`,true)}
function stock(){head('Estoque e produção diária','Registre o que levou para vender, feche o dia e consulte tudo agrupado por data.','<button class="primary" onclick="ADM.editProduct()">+ Produto</button>');let date=window._stockDate||isoToday();let grouped={};D.dailyStock.forEach(r=>(grouped[r.date]??=[]).push(r));let dates=Object.keys(grouped).sort((a,b)=>b.localeCompare(a)).slice(0,80),closed=stockClosing(date);content.innerHTML+=`<div class="card"><div class="filters"><div><label>Data</label><input id="stockDate" type="date" value="${date}" onchange="window._stockDate=this.value;ADM.go('stock')"></div><div class="small"><button class="primary" onclick="ADM.saveDailyStock()">💾 Salvar o que levei</button></div><div class="small">${closed?`<button class="secondary" onclick="ADM.reopenStockDay('${date}')">🔓 Reabrir dia</button>`:`<button class="success" onclick="ADM.closeStockDay('${date}')">🔒 Fechar estoque do dia</button>`}</div></div><div class="notice" style="margin-top:12px">Aqui você informa <b>tudo o que levou para vender</b>. No fim do dia, clique em <b>Fechar estoque do dia</b> e informe quanto sobrou. O histórico ficará agrupado em um único dia.</div>${D.products.map(p=>{let q=dailyStockRec(date,p.id);let val=q?Number(q.produced||0):(date===isoToday()?p.stock:0);return `<div class="row"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · ${p.active?'ativo':'inativo'}</div></div><div class="stock-actions" style="display:flex;align-items:center;gap:7px"><button class="secondary" ${closed?'disabled':''} onclick="document.getElementById('ds-${p.id}').stepDown()">−</button><input id="ds-${p.id}" type="number" min="0" value="${val}" ${closed?'disabled':''} style="width:84px;text-align:center"><button class="secondary" ${closed?'disabled':''} onclick="document.getElementById('ds-${p.id}').stepUp()">+</button><button class="ghost" onclick="ADM.editProduct('${p.id}')">Editar</button><button class="danger" onclick="ADM.deleteProduct('${p.id}')">Excluir</button></div></div>`}).join('')}</div><div class="card"><h3>📅 Histórico de estoque por dia</h3>${dates.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Produtos</th><th>Levados</th><th>Saídas</th><th>Restantes</th><th>Status</th><th>Ação</th></tr></thead><tbody>${dates.map(d=>{let a=grouped[d],p=a.reduce((s,r)=>s+Number(r.produced||0),0),rem=a.reduce((s,r)=>s+Number(r.remaining||0),0),c=stockClosing(d);return `<tr class="clickable" onclick="ADM.stockDayDetail('${d}')"><td><b>${brDate(d)}</b></td><td>${a.filter(r=>Number(r.produced||0)>0).length}</td><td>${p}</td><td>${Math.max(0,p-rem)}</td><td>${rem}</td><td><span class="tag ${c?'ok':'warn'}">${c?'Fechado':'Aberto'}</span></td><td><button class="danger" onclick="event.stopPropagation();ADM.deleteStockDay('${d}')">Excluir dia</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Ainda não há estoque diário registrado.</div>'}</div>`}
function stockStep(id,n){let p=D.products.find(x=>x.id===id);p.stock=Math.max(0,p.stock+n);let r=dailyStockRec(isoToday(),id);if(r)r.remaining=p.stock;save();stock()}
function editProduct(id){let p=D.products.find(x=>x.id===id)||{id:'',name:'',price:'',stock:0,active:true};modal(`<h2>${id?'Editar':'Novo'} produto</h2><label>Nome</label><input id="prName" value="${esc(p.name)}"><div class="two"><div><label>Preço</label><input id="prPrice" type="number" step="0.01" value="${p.price}"></div><div><label>Estoque disponível hoje</label><input id="prStock" type="number" min="0" value="${p.stock}"></div></div><label><input id="prActive" type="checkbox" style="width:auto" ${p.active?'checked':''}> Produto ativo no cardápio</label><button class="primary" style="width:100%;margin-top:12px" onclick="ADM.saveProduct('${id||''}')">Salvar</button>`)}
function deleteProduct(id){let p=D.products.find(x=>x.id===id);if(!p)return;if(!confirm('Excluir este produto?\n\nOs pedidos e o histórico de produção serão mantidos. O produto será removido apenas do catálogo.'))return;D.products=D.products.filter(x=>x.id!==id);save();stock();toast('Produto excluído')}
function saveProduct(id){let name=prName.value.trim(),price=Number(prPrice.value),st=Number(prStock.value);if(!name||price<=0)return toast('Informe nome e preço válidos');let p=id?D.products.find(x=>x.id===id):null;if(p)Object.assign(p,{name,price,stock:Math.max(0,st),active:prActive.checked});else D.products.push({id:uid('P'),name,price,stock:Math.max(0,st),active:prActive.checked});let pid=p?.id||D.products[D.products.length-1].id;let r=dailyStockRec(isoToday(),pid);if(r){r.remaining=Math.max(0,st);r.productName=name}else D.dailyStock.push({id:uid('DS'),date:isoToday(),productId:pid,productName:name,produced:Math.max(0,st),remaining:Math.max(0,st)});save();closeModal();stock();toast('Produto salvo')}

function reports(){head('Relatórios','Filtre período e produto para analisar faturamento, ganhos, gastos e desempenho.','<button class="secondary" onclick="ADM.exportReportCSV()">⬇ Exportar CSV</button>');content.innerHTML+=`<div class="card"><div class="filters"><div><label>De</label><input id="fFrom" type="date" value="${filter.from}"></div><div><label>Até</label><input id="fTo" type="date" value="${filter.to}"></div><div><label>Produto</label><select id="rProduct"><option value="all">Todos</option>${D.products.map(p=>`<option value="${esc(p.name)}" ${filter.product===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="small"><button class="primary" onclick="ADM.applyReportFilter()">Aplicar</button></div></div></div>`;let os=filteredOrders();if(filter.product!=='all')os=os.filter(o=>o.items.some(i=>i.name===filter.product));let fat=os.reduce((s,o)=>s+o.total,0),rec=os.reduce((s,o)=>s+(o.paid?o.total:0),0),ex=expensesTotal();content.innerHTML+=`<div class="cards">${kpi('Faturamento',money(fat),'var(--blue)',prevMonthCompare('faturamento'))}${kpi('Recebido',money(rec),'var(--success)',prevMonthCompare('recebido'))}${kpi('Despesas',money(ex),'var(--orange)',prevMonthCompare('despesa'))}${kpi('Ganho líquido',money(rec-ex),'var(--pink)',prevMonthCompare('lucro'))}</div><div class="grid2"><div class="card"><h3>Comparativo mensal</h3><div id="reportLine"></div></div><div class="card"><h3>Ranking de produtos</h3><div id="reportBars"></div></div></div><div class="card"><h3>Resumo mês a mês</h3>${monthlyTable()}</div>`;drawMonthlyLine('reportLine');drawTopProducts('reportBars')}
function applyReportFilter(){filter.from=fFrom.value;filter.to=fTo.value;filter.product=rProduct.value;reports()}
function monthlyTable(){let a=monthlySeries(12);return `<div class="table-wrap"><table class="table"><thead><tr><th>Mês</th><th>Faturamento</th><th>Recebido</th><th>Despesas</th><th>Resultado</th><th>Variação fat.</th></tr></thead><tbody>${a.map((x,i)=>{let prev=i?a[i-1].revenue:0,pct=prev?((x.revenue-prev)/Math.abs(prev)*100):0;return `<tr><td><b>${x.label}</b></td><td>${money(x.revenue)}</td><td>${money(x.received)}</td><td>${money(x.expenses)}</td><td><b>${money(x.received-x.expenses)}</b></td><td class="${pct>=0?'up':'down'}">${pct>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</td></tr>`}).join('')}</tbody></table></div>`}
function exportReportCSV(){let rows=[['Data','Hora','Cliente','Total','Pago','Status','Itens']];filteredOrders().forEach(o=>rows.push([o.iso,o.time,o.clientName,o.total,o.paid?'Sim':'Não',o.status,o.items.map(i=>`${i.qty}x ${i.name}`).join(' | ')]));downloadText('relatorio-yas-doce-essencia.csv',rows.map(r=>r.map(csvCell).join(';')).join('\n'),'text/csv;charset=utf-8')}

function downloadText(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importSpreadsheet(){head('Central de importação / sincronização','Esta é a central de sincronização com a planilha oficial — separada do Dashboard.');content.innerHTML+=`<div class="card" style="border:2px solid var(--primary)"><div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap"><div style="font-size:42px">📥</div><div style="flex:1;min-width:240px"><h2 style="margin:0 0 6px">Importar arquivo</h2><p class="muted">Selecione diretamente uma planilha do seu computador ou celular.</p><label style="font-size:14px;color:var(--text)">Arquivo da planilha</label><input id="importFile" class="file-picker" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:block!important;width:100%!important;min-height:48px!important;padding:10px!important;border:2px solid var(--primary)!important;border-radius:13px!important;background:var(--surface)!important;color:var(--text)!important;cursor:pointer!important;opacity:1!important;pointer-events:auto!important"><p id="selectedFileName" class="muted" style="margin:10px 0 0">Nenhum arquivo selecionado</p></div></div><div id="dropZone" class="upload-zone" style="margin-top:16px"><div class="big">📊</div><b>Ou arraste e solte o arquivo aqui</b><p class="muted">Formatos aceitos: XLSX, XLS e CSV</p></div><div id="importStatus" style="margin-top:12px"></div><div class="notice" style="margin-top:12px"><b>🔒 Importação segura:</b> a planilha é a fonte oficial. A planilha é a fonte oficial. A cada importação, os registros anteriores que vieram da planilha são reconstruídos exatamente a partir do novo arquivo. Pedidos feitos diretamente no site permanecem separados. Vendas idênticas legítimas são preservadas, porque cada linha da planilha representa um registro.</div></div><div class="card" style="border:2px solid var(--primary)"><h3>☁️ Próxima etapa: sincronização online</h3><p class="muted">A V16 já usa o modo <b>snapshot exato</b> para a planilha. Na versão online, vamos ligar esta mesma fonte ao Google Sheets com sincronização de mão dupla: <b>Planilha ↔ Banco online ↔ Site</b>.</p><div class="row"><span>Fonte oficial</span><b>Google Sheets</b></div><div class="row"><span>Atualização pelo site</span><b>Preparada para status/forma/vencimento</b></div></div><div class="grid2"><div class="card"><h3>🧠 O que o sistema procura</h3><p class="muted">Colunas como Data, Cliente, Produto, Quantidade, Valor/Total, Status/Pago, Descrição e Despesa. Vendas entram no histórico e despesas entram nos gastos.</p></div><div class="card"><h3>🗂️ Última planilha importada</h3>${D.imports.slice().reverse().map(i=>`<div class="row"><div><b>${esc(i.file)}</b><div class="muted">${i.date}</div></div><span class="tag ok">${i.added} novos</span></div>`).join('')||'<div class="empty">Nenhuma sincronização ainda.</div>'}</div></div>`;let f=$('#importFile');if(f)f.addEventListener('change',e=>{let file=e.target.files&&e.target.files[0];if(file)ADM.handleImport(file)});setupDrop()}
function setupDrop(){let z=$('#dropZone');if(!z)return;['dragenter','dragover'].forEach(e=>z.addEventListener(e,x=>{x.preventDefault();z.classList.add('drag')}));['dragleave','drop'].forEach(e=>z.addEventListener(e,x=>{x.preventDefault();z.classList.remove('drag')}));z.addEventListener('drop',e=>{let f=e.dataTransfer.files[0];if(f)ADM.handleImport(f)})}
function handleImport(file){if(!file)return;let nameEl=$('#selectedFileName');if(nameEl)nameEl.innerHTML=`Arquivo selecionado: <b>${esc(file.name)}</b>`;let statusEl=$('#importStatus');if(statusEl)statusEl.innerHTML='<div class="notice">⏳ Lendo a planilha e identificando as abas...</div>';let ext=file.name.split('.').pop().toLowerCase();if(ext==='csv'){let r=new FileReader();r.onload=()=>importCSV(r.result,file.name);r.readAsText(file,'UTF-8')}else loadSheetJS(()=>{if(!window.XLSX){let el=$('#importStatus');if(el)el.innerHTML='<div class="notice">Não consegui carregar o leitor XLSX. Verifique sua conexão e tente novamente.</div>';return;}let r=new FileReader();r.onload=()=>{try{let wb=XLSX.read(r.result,{type:'array',cellDates:true});importWorkbook(wb,file.name)}catch(err){let el=$('#importStatus');if(el)el.innerHTML='<div class="notice">❌ Não consegui ler esta planilha. Confira se o arquivo é um XLSX/XLS válido.</div>';}};r.readAsArrayBuffer(file)})}
function loadSheetJS(cb){if(window.XLSX)return cb();let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=cb;s.onerror=cb;document.head.appendChild(s)}
function importCSV(text,name){let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return;let sep=(lines[0].split(';').length>=lines[0].split(',').length)?';':',';let parse=line=>{let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===sep&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out};let h=parse(lines[0]).map(x=>x.trim());let rows=lines.slice(1).map(l=>{let a=parse(l),o={};h.forEach((k,i)=>o[k]=a[i]??'');return o});importRows(rows,name)}
function keyObj(o){let n={};Object.keys(o).forEach(k=>n[normalize(k).normalize('NFD').replace(/[\u0300-\u036f]/g,'')]=o[k]);return n}
function val(o,names){for(let n of names){let k=Object.keys(o).find(k=>k===n||k.includes(n));if(k!=null&&String(o[k]).trim()!=='')return o[k]}return''}
function parseMoney(v){if(typeof v==='number')return v;let s=String(v||'').replace(/R\$/gi,'').replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');return Number(s.replace(/[^0-9.-]/g,''))||0}
function parseDate(v){if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;if(typeof v==='number'&&isFinite(v)){let d=new Date(Date.UTC(1899,11,30)+v*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}let s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);let m=s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);if(m){let y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''}
function signature(parts){let s=parts.join('|').toLowerCase().trim(),h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'imp-'+(h>>>0).toString(16)}
function sheetRows(wb,names){let name=wb.SheetNames.find(n=>names.includes(normalize(n))||names.some(x=>normalize(n).includes(x)));if(!name)return [];return XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:'',raw:true}).map((r,i)=>Object.assign({_sheetName:name,_rowNumber:i+2},r))}
function canonicalSaleKey(date,client,product,qty,total,due){
  return signature(['sale-canonical',date,normalize(client),normalize(product),Number(qty)||0,Number(total||0).toFixed(2),parseDate(due)||'']);
}
function canonicalExpenseKey(date,desc,value){
  return signature(['expense-canonical',date,normalize(desc),Number(value||0).toFixed(2)]);
}
function importWorkbook(wb,fileName){
  /* V16: a planilha é a fonte oficial. Toda nova importação reconstrói
     exclusivamente os registros que vieram da planilha, preservando
     pedidos/despesas feitos diretamente no site. Isso elimina divergências
     acumuladas por imports antigos e mantém duplicidades legítimas. */
  let added=0,updated=0,skip=0,prodAdded=0,expAdded=0,contasValidas=0;
  const importedBeforeOrders=D.orders.filter(o=>o.source==='import').length;
  const importedBeforeExpenses=D.expenses.filter(e=>e.source==='import').length;
  // Removemos somente a cópia anterior proveniente da planilha. Registros
  // criados pelo site permanecem intactos.
  D.orders=D.orders.filter(o=>o.source!=='import');
  D.expenses=D.expenses.filter(e=>e.source!=='import');

  const productRows=sheetRows(wb,['produtos','produto']);
  const productNames=new Set();
  productRows.forEach(raw=>{
    let o=keyObj(raw),name=String(val(o,['produto','nome','item'])).trim(),price=parseMoney(val(o,['valor','preco','preço','valor unitario','valor unitário']));
    if(!name||price<=0)return;
    productNames.add(normalize(name));
    let p=D.products.find(x=>normalize(x.name)===normalize(name));
    if(p){p.price=price;p.updatedAt=new Date().toISOString();}
    else {D.products.push({id:uid('P'),name,price,stock:0,active:true});prodAdded++;}
  });

  const salesRows=sheetRows(wb,['vendas','venda']);
  salesRows.forEach(raw=>{
    let o=keyObj(raw),date=parseDate(val(o,['data','date','dia'])),client=String(val(o,['cliente','nome','comprador'])).trim(),product=String(val(o,['produto','item','mercadoria'])).trim();
    let qty=parseMoney(val(o,['quantidade','qtd','qtde']))||1,unit=parseMoney(val(o,['valor unitario','valor unitário','preco unitario','preço unitário'])),total=parseMoney(val(o,['total','valor total']));
    if(!total&&unit)total=qty*unit;
    if(!date||!client||!product||total<=0){skip++;return;}
    let rawStatus=String(val(o,['status','situacao','situação','pagamento','pago'])).trim().toLowerCase();
    let paid=/pago|quitado|sim/.test(rawStatus)&&!/nao|não|pendente/.test(rawStatus);
    let method=String(val(o,['forma pagamento','forma de pagamento','metodo','método','pagamento'])).trim()||'Importado';
    let due=parseDate(val(o,['vencimento']));
    D.orders.push({id:uid('IMP'),code:null,clientName:client,customerId:null,items:[{id:null,name:product,qty,price:unit||total/qty}],total,status:'Histórico',iso:date,time:'--:--',method,paid,source:'import',due,syncSource:'planilha',sheetName:raw._sheetName||'Vendas',sheetRow:raw._rowNumber||0});
    added++;
  });

  const expenseRows=sheetRows(wb,['despesas','despesa','gastos','gasto']);
  expenseRows.forEach(raw=>{
    let o=keyObj(raw),date=parseDate(val(o,['data','date','dia'])),desc=String(val(o,['descricao','descrição','despesa','gasto','categoria'])).trim(),value=parseMoney(val(o,['valor','valor despesa','despesa','gasto','custo']));
    if(!date||value<=0){skip++;return;}
    D.expenses.push({id:uid('E'),iso:date,description:desc||'Despesa importada',category:String(val(o,['categoria','category'])).trim()||'Importado',value,source:'import',syncSource:'planilha',sheetName:raw._sheetName||'Despesas',sheetRow:raw._rowNumber||0});
    expAdded++;
  });

  const accountRows=sheetRows(wb,['contas','conta']);
  accountRows.forEach(raw=>{let o=keyObj(raw),client=String(val(o,['cliente','nome'])).trim(),value=parseMoney(val(o,['valor','total']));if(client&&value>0)contasValidas++;});

  const sheetRevenue=D.orders.filter(o=>o.source==='import').reduce((s,o)=>s+Number(o.total||0),0);
  const sheetReceived=D.orders.filter(o=>o.source==='import'&&o.paid).reduce((s,o)=>s+Number(o.total||0),0);
  const sheetPending=sheetRevenue-sheetReceived;
  const sheetExpenses=D.expenses.filter(e=>e.source==='import').reduce((s,e)=>s+Number(e.value||0),0);
  const sheetBalance=sheetReceived-sheetExpenses;
  D.imports=[{id:uid('I'),file:fileName,date:new Date().toLocaleString('pt-BR'),added,updated,skipped:skip,productsAdded:prodAdded,expensesAdded:expAdded,accountsDetected:contasValidas,source:'planilha-oficial',mode:'snapshot-exato',previousImportedOrders:importedBeforeOrders,previousImportedExpenses:importedBeforeExpenses,totals:{revenue:sheetRevenue,received:sheetReceived,pending:sheetPending,expenses:sheetExpenses,balance:sheetBalance}}];
  save();
  let dates=D.orders.filter(o=>o.source==='import'&&o.iso).map(o=>o.iso).concat(D.expenses.filter(e=>e.source==='import'&&e.iso).map(e=>e.iso)).sort();
  if(dates.length){filter.from=dates[0];filter.to=dates[dates.length-1];filter.product='all';filter.payment='all';}
  let statusBox=$('#importStatus');
  if(statusBox)statusBox.innerHTML=`<div class="notice"><h3 style="margin:0 0 10px">✅ Planilha sincronizada como fonte oficial</h3><div class="grid3"><div><b>Faturamento</b><br><strong>${money(sheetRevenue)}</strong></div><div><b>Recebido</b><br><strong>${money(sheetReceived)}</strong></div><div><b>Pendente</b><br><strong>${money(sheetPending)}</strong></div></div><div class="grid2" style="margin-top:12px"><div><b>Despesas</b><br><strong>${money(sheetExpenses)}</strong></div><div><b>Saldo</b><br><strong>${money(sheetBalance)}</strong></div></div><div class="divider"></div><b>83/83?</b> O sistema reconstrói os registros da aba Vendas exatamente como estão na planilha, inclusive vendas idênticas legítimas. Contas não é somada novamente. <br><br><span class="muted">Antes: ${importedBeforeOrders} vendas importadas e ${importedBeforeExpenses} despesas importadas. Agora: ${added} vendas e ${expAdded} despesas da planilha.</span></div>`;
  setTimeout(importSpreadsheet,1800);
}

function importRows(rows,fileName){
  let added=0,skip=0;
  D.orders=D.orders.filter(o=>o.source!=='import');
  rows.forEach((raw,rowIndex)=>{
    let o=keyObj(raw),date=parseDate(val(o,['data','date','dia'])),client=String(val(o,['cliente','nome','comprador'])).trim(),product=String(val(o,['produto','item','mercadoria'])).trim();
    let qty=parseMoney(val(o,['quantidade','qtd','qtde']))||1,unit=parseMoney(val(o,['valor unitario','valor unitário','preco unitario','preço unitário'])),total=parseMoney(val(o,['total','valor total']));
    if(!total&&unit)total=qty*unit;
    if(!date||!client||!product||total<=0){skip++;return;}
    let st=String(val(o,['status','situacao','situação','pagamento','pago'])).toLowerCase(),paid=/pago|quitado|sim/.test(st)&&!/nao|não|pendente/.test(st),method=String(val(o,['forma pagamento','forma de pagamento','metodo','método'])).trim()||'Importado',due=parseDate(val(o,['vencimento']));
    D.orders.push({id:uid('IMP'),code:null,clientName:client,customerId:null,items:[{id:null,name:product,qty,price:unit||total/qty}],total,status:'Histórico',iso:date,time:'--:--',method,paid,source:'import',due,syncSource:'planilha',sheetRow:rowIndex+2});
    added++;
  });
  D.imports=[{id:uid('I'),file:fileName,date:new Date().toLocaleString('pt-BR'),added,updated:0,skipped:skip,source:'planilha-oficial',mode:'snapshot-exato'}];save();let dates=D.orders.filter(o=>o.source==='import'&&o.iso).map(o=>o.iso).sort();if(dates.length){filter.from=dates[0];filter.to=dates[dates.length-1];}let statusBox=$('#importStatus');if(statusBox)statusBox.innerHTML=`<div class="notice">✅ Planilha sincronizada exatamente: <b>${added}</b> vendas importadas · <b>${skip}</b> linhas ignoradas.</div>`;setTimeout(importSpreadsheet,1400);
}
